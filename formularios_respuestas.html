<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LECTRA | Respuestas de Formularios</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020817;
      --panel: #0f172a;
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --line: #334155;
      --brand: #3b82f6;
      --brand-2: #2563eb;
      --shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.18), transparent 38%),
        linear-gradient(160deg, #020617 0%, #0b1324 45%, #020817 100%);
      color: var(--ink);
    }

    .shell {
      max-width: 1300px;
      margin: 0 auto;
      padding: 28px 20px 48px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: var(--shadow);
    }

    .hero {
      padding: 22px;
      margin-bottom: 16px;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 12px 0 8px;
      font-size: clamp(28px, 4vw, 44px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .hero p {
      margin: 0;
      color: var(--muted);
    }

    .controls {
      padding: 16px;
      margin-bottom: 14px;
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr auto auto;
      gap: 10px;
      align-items: end;
    }

    .control label {
      display: block;
      margin-bottom: 6px;
      color: #cbd5e1;
      font-size: 13px;
      font-weight: 600;
    }

    input,
    select,
    button {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 11px 12px;
      font: inherit;
      background: #0b1324;
      color: var(--ink);
    }

    input::placeholder {
      color: #64748b;
    }

    button {
      cursor: pointer;
      font-weight: 700;
      width: auto;
      padding: 11px 14px;
    }

    .primary {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border: 0;
      color: white;
    }

    .secondary {
      background: #1e293b;
      color: #cbd5e1;
    }

    .table-wrap {
      padding: 12px;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
    }

    th,
    td {
      border-bottom: 1px solid rgba(148, 163, 184, 0.18);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: 14px;
    }

    th {
      font-size: 12px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      color: #93c5fd;
      position: sticky;
      top: 0;
      background: #0f172a;
      z-index: 2;
    }

    .state {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(15, 23, 42, 0.8);
      color: #cbd5e1;
      text-transform: lowercase;
    }

    details {
      border: 1px solid rgba(148, 163, 184, 0.28);
      border-radius: 10px;
      background: rgba(15, 23, 42, 0.72);
      padding: 8px 10px;
    }

    details summary {
      cursor: pointer;
      color: #93c5fd;
      font-weight: 600;
      user-select: none;
    }

    pre {
      margin: 10px 0 0;
      max-height: 240px;
      overflow: auto;
      font-size: 12px;
      line-height: 1.45;
      color: #cbd5e1;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .muted {
      color: var(--muted);
      font-size: 13px;
    }

    .loading,
    .empty {
      padding: 36px 20px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 1100px) {
      .controls {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 720px) {
      .controls {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="panel hero">
      <span class="eyebrow">LECTRA Respuestas</span>
      <h1>Consulta las respuestas de formularios.</h1>
      <p>Vista conectada a la tabla public.formularios_respuestas con filtros y detalle JSON.</p>
    </section>

    <section class="panel controls">
      <div class="control">
        <label for="filter-search">Buscar</label>
        <input id="filter-search" type="text" placeholder="ID, usuario, formulario, texto en respuesta...">
      </div>
      <div class="control">
        <label for="filter-form">Formulario</label>
        <select id="filter-form">
          <option value="">Todos</option>
        </select>
      </div>
      <div class="control">
        <label for="filter-state">Estado</label>
        <select id="filter-state">
          <option value="">Todos</option>
        </select>
      </div>
      <button class="secondary" id="btn-refresh" type="button">Refrescar</button>
      <button class="primary" id="btn-export" type="button">Exportar CSV</button>
    </section>

    <section class="panel table-wrap">
      <div id="loading" class="loading">Cargando respuestas...</div>
      <div id="table-container"></div>
    </section>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./table-logic-formularios_respuestas.js"></script>
</body>
</html>

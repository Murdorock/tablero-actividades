<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen Jornada - Sistema</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="config.js"></script>
    <script>const TABLE_NAME = 'base'; const TABLE_TITLE = '📊 Resumen Jornada';</script>
    <script src="table-logic-resumen_jornada.js"></script>
    <style>
        .resumen-kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .resumen-kpi-card,
        .resumen-chart-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 14px;
        }

        .resumen-kpi-card {
            border-left: 4px solid #475569;
        }

        .resumen-kpi-label {
            font-size: 12px;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        .resumen-kpi-value {
            font-size: 22px;
            font-weight: 700;
            color: #f1f5f9;
            line-height: 1.1;
        }

        .resumen-kpi-sub {
            color: #cbd5e1;
            font-size: 12px;
            margin-top: 4px;
        }

        .resumen-charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-bottom: 16px;
        }

        .resumen-chart-card h3 {
            margin: 0 0 12px;
            color: #e2e8f0;
            font-size: 14px;
            font-weight: 600;
        }

        .resumen-chart-box {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px;
            min-height: 280px;
        }

        @media (max-width: 1200px) {
            .resumen-charts-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="table-container">
        <div class="table-header">
            <h2>📊 Resumen Jornada</h2>
            <div class="table-actions">
                <button class="btn btn-primary" onclick="abrirModalCompacto()">📱 Ver Resumen Compacto</button>
                <button class="btn btn-success" onclick="exportarTablas()">📥 Exportar</button>
                <button class="btn btn-secondary" onclick="loadData()">🔄 Actualizar</button>
            </div>
        </div>
        <div id="summaryDashboard" style="display: none;">
            <div id="summaryKpis" class="resumen-kpi-grid"></div>
            <div class="resumen-charts-grid">
                <div class="resumen-chart-card">
                    <h3>Registro por Supervisor</h3>
                    <div class="resumen-chart-box">
                        <canvas id="chart-registro-supervisores"></canvas>
                    </div>
                </div>
                <div class="resumen-chart-card">
                    <h3>Descargas por Supervisor</h3>
                    <div class="resumen-chart-box">
                        <canvas id="chart-descargas-supervisores"></canvas>
                    </div>
                </div>
            </div>
        </div>
        <div class="data-table-wrapper">
            <div id="loadingIndicator" class="loading"><div class="spinner"></div><p>Cargando...</p></div>
            <div id="tableContainer"></div>
        </div>
    </div>

    <!-- Modal Resumen Compacto -->
    <div id="modalCompacto" class="modal" style="display: none;">
        <div class="modal-content" style="max-width: 95vw; max-height: 95vh; overflow: auto; background: #1e293b;">
            <div class="modal-header" style="background: #475569; color: white; padding: 1rem; display: flex; justify-content: space-between; align-items: center;">
                <h3 style="margin: 0;">📊 Resumen Jornada - Totales</h3>
                <span class="close" onclick="cerrarModalCompacto()" style="cursor: pointer; font-size: 1.5rem;">&times;</span>
            </div>
            <div class="modal-body" id="modalCompactoBody" style="padding: 1rem; background: #1e293b;">
                <!-- Contenido generado dinámicamente -->
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMLEC - Sistema</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script src="table-logic-cmlec.js"></script>
</head>
<body>
    <div class="table-container">
        <div class="table-header">
            <h2>📊 CMLEC</h2>
            <div class="table-actions">
                <button class="btn btn-secondary" onclick="loadData()">🔄 Actualizar</button>
                <label class="btn btn-success" style="margin-left:8px; cursor:pointer;">
                    📥 Cargar
                    <input type="file" id="excelInput" accept=".xlsx,.xls" style="display:none;">
                </label>
            </div>
        </div>
        <div class="filter-container">
            <div class="filter-group">
                <label for="filtro-correria-mp" style="color: #e2e8f0;">Correría MP:</label>
                <input type="text" id="filtro-correria-mp" list="correria-mp-list" placeholder="Buscar o seleccionar..." oninput="applyFilters()">
                <datalist id="correria-mp-list">
                </datalist>
            </div>
            <div class="filter-group">
                <label for="filtro-terminal" style="color: #e2e8f0;">Terminal:</label>
                <input type="text" id="filtro-terminal" list="terminal-list" placeholder="Buscar o seleccionar..." oninput="applyFilters()">
                <datalist id="terminal-list">
                </datalist>
            </div>
            <div class="filter-group">
                <button class="btn btn-secondary btn-sm" onclick="clearFilters()">🗑️ Limpiar Filtros</button>
            </div>
        </div>
        <div class="data-table-wrapper">
            <div id="loadingIndicator" class="loading"><div class="spinner"></div><p>Cargando...</p></div>
            <div id="tableContainer"></div>
        </div>
    </div>
    <div id="dataModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 id="modalTitle"></h3></div>
            <form id="dataForm">
                <input type="hidden" id="recordId">
                <div id="formFields"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>
        </div>
    </div>
</body>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
    // Cargar Excel para cmlec
    const excelInput = document.getElementById('excelInput');
    const tablaActual = 'cmlec';
    const contenido = document.getElementById('tableContainer');
    let datos = [];
    let columnas = [];
    // Usar supabase como supabaseClient (compatibilidad)
    const supabaseClient = window.supabase;

        excelInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        contenido.innerHTML = '<p>Procesando Excel...</p>';
        try {
            const data = await file.arrayBuffer();
            const workbook = XLSX.read(data, { type: 'array' });
            const sheet = workbook.Sheets[workbook.SheetNames[0]];
            const rows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: null, blankrows: true });
            if (!rows.length) return alert('El archivo Excel está vacío.');
            const normalizeHeader = (value) => (value || '')
                .toString()
                .normalize('NFD')
                .replace(/[\u0300-\u036f]/g, '')
                .toLowerCase()
                .replace(/[^a-z0-9]+/g, ' ')
                .trim();
            const headerMap = {
                'correria sirius': 'correria_sirius',
                'correria mp': 'correria_mp',
                'periodo de consumo': 'periodo_consumo',
                'ciclo de consumo': 'ciclo_consumo',
                'zona': 'zona',
                'terminal': 'terminal',
                'cantidad de ordenes por descargar': 'ordenes_descargar',
                'cantidad de ordenes por legalizar': 'ordenes_legalizar',
                'cantidad de ordenes descargadas sin lectura': 'ordenes_no_lectura',
                'cantidad de ordenes descargadas': 'ordenes_no_lectura'
            };
            // Detectar automáticamente la fila de encabezados (priorizando la fila 8 esperada)
            let headerRowIndex = -1;
            let mappedColumns = [];
            let bestMatchCount = -1;
            const maxRowsToScan = Math.min(rows.length, 25);
            for (let idx = 0; idx < maxRowsToScan; idx++) {
                const currentRow = rows[idx] || [];
                const currentMapped = currentRow.map((cell) => headerMap[normalizeHeader(cell)] || null);
                const uniqueMatches = [...new Set(currentMapped.filter(Boolean))];
                const matchCount = uniqueMatches.length;
                if (matchCount > bestMatchCount) {
                    bestMatchCount = matchCount;
                    headerRowIndex = idx;
                    mappedColumns = currentMapped;
                }
            }
            if (headerRowIndex < 0 || bestMatchCount <= 0) {
                return alert('No se pudo detectar la fila de encabezados en el Excel.');
            }
            const columnasEsperadas = ['correria_sirius', 'correria_mp', 'periodo_consumo', 'ciclo_consumo', 'zona', 'terminal', 'ordenes_descargar', 'ordenes_legalizar', 'ordenes_no_lectura'];
            const columnasDetectadas = mappedColumns.filter(Boolean);
            const faltantes = columnasEsperadas.filter((col) => !columnasDetectadas.includes(col));
            if (faltantes.length) {
                return alert('Faltan columnas en el Excel (fila detectada: ' + (headerRowIndex + 1) + '): ' + faltantes.join(', '));
            }
            const dataRows = rows.slice(headerRowIndex + 1);
            const objetos = dataRows
                .map((r, idx) => {
                    const obj = {};
                    mappedColumns.forEach((col, i) => {
                        if (col) obj[col] = r[i] ?? null;
                    });
                    // La tabla cmlec mantiene id_llave como NOT NULL: se genera automáticamente.
                    const toSafe = (value) => (value ?? '').toString().trim();
                    const keyParts = [
                        toSafe(obj.correria_sirius),
                        toSafe(obj.correria_mp),
                        toSafe(obj.periodo_consumo),
                        toSafe(obj.terminal)
                    ].filter(Boolean);
                    const generatedKey = keyParts.length ? keyParts.join('|') : `cmlec_${Date.now()}_${idx}`;
                    obj.id_llave = generatedKey;
                    // Compatibilidad con estructuras antiguas donde padre_id también existe.
                    if (obj.padre_id === undefined || obj.padre_id === null || obj.padre_id === '') {
                        obj.padre_id = generatedKey;
                    }
                    return obj;
                })
                .filter((obj) => Object.values(obj).some((v) => v !== null && v !== ''));
            if (!objetos.length) return alert('No hay datos para cargar.');
            // Limpiar la tabla cmlec antes de insertar
            await supabaseClient.from('cmlec').delete().neq('id_llave', null);
            // Insertar en Supabase
            let error = null;
            // Insertar en lotes de 500 si es necesario
            for (let i = 0; i < objetos.length; i += 500) {
                const { error: err } = await supabaseClient.from('cmlec').insert(objetos.slice(i, i+500));
                if (err) error = err;
            }
            if (error) {
                alert('Error al cargar: ' + error.message);
            } else {
                alert('Datos cargados correctamente.');
            }
            await cargarTabla();
        } catch (err) {
            alert('Error procesando el archivo: ' + err.message);
        }
        excelInput.value = '';
    });

    async function cargarTabla() {
        contenido.innerHTML = '<p>Cargando...</p>';
        const { data, error } = await supabaseClient.from(tablaActual).select('*');
        if (error || !data) {
            contenido.innerHTML = '<p>Error al obtener datos.</p>';
            return;
        }
        datos = data;
        columnas = datos.length ? Object.keys(datos[0]) : [];
        if (typeof renderTabla === 'function') renderTabla();
    }
</script>
</html>

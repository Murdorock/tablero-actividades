<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resumen Repartida</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="config.js"></script>
    <script src="table-logic-resumen_repartida.js"></script>
    <style>
        .section-block {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 28px;
        }
        .section-block h2 {
            color: #f1f5f9;
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 14px;
        }
        .rr-search {
            width: 100%;
            padding: 9px 14px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 14px;
            margin-bottom: 10px;
            box-sizing: border-box;
        }
        .rr-search::placeholder { color: #64748b; }
        .rr-search:focus { outline: none; border-color: #3b82f6; }
        .rr-select {
            padding: 9px 14px;
            border: 1px solid #334155;
            border-radius: 6px;
            background: #0f172a;
            color: #f1f5f9;
            font-size: 14px;
            min-width: 220px;
            margin-bottom: 10px;
            cursor: pointer;
        }
        .rr-select:focus { outline: none; border-color: #3b82f6; }
        .rr-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .rr-table th {
            background: #0f172a;
            color: #94a3b8;
            font-weight: 600;
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #334155;
            white-space: nowrap;
            position: sticky;
            top: 0;
            z-index: 1;
        }
        .rr-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #263244;
            color: #e2e8f0;
        }
        .rr-table tbody tr:hover { background: #1e3a5f; }
        .rr-scroll {
            overflow-x: auto;
            max-height: 420px;
            overflow-y: auto;
            border-radius: 8px;
            border: 1px solid #334155;
        }
        .rr-empty { text-align: center; padding: 30px; color: #64748b; font-size: 14px; }
        .rr-loading { text-align: center; padding: 30px; color: #94a3b8; font-size: 14px; }
        .rr-count { font-size: 12px; color: #64748b; margin-bottom: 8px; }
        .c-cert { color: #34d399; font-weight: 600; }
        .c-ctrl { color: #60a5fa; font-weight: 600; }
        .c-paq  { color: #f59e0b; font-weight: 600; }
        .rr-toolbar {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="table-container">

        <!-- TABLA 0: Resumen agrupado por supervisor -->
        <div class="section-block" id="summaryExportSection">
            <h2>Resumen por Supervisor</h2>
            <div class="rr-toolbar">
                <button class="btn btn-info" id="exportSummaryImageBtn" type="button" onclick="exportSummaryAsImage()">Exportar imagen</button>
            </div>
            <div class="rr-count" id="countT0"></div>
            <div class="rr-scroll">
                <div id="table0Container" class="rr-loading">Cargando...</div>
            </div>
        </div>

        <!-- TABLA 1: Consulta por correria/codigo -->
        <div class="section-block">
            <h2>Resumen Repartida</h2>
            <input type="text" id="searchT1" class="rr-search" placeholder="Buscar por ID Correria o Codigo...">
            <div class="rr-count" id="countT1"></div>
            <div class="rr-scroll">
                <div id="table1Container" class="rr-loading">Cargando...</div>
            </div>
        </div>

        <!-- TABLA 2: Detalle por supervisor cruzado con certificaciones -->
        <div class="section-block" id="detailExportSection">
            <h2>Detalle por Supervisor</h2>
            <div class="rr-toolbar">
                <select id="supSelect" class="rr-select">
                    <option value="">-- Seleccione un supervisor --</option>
                </select>
                <button class="btn btn-info" id="exportDetailImageBtn" type="button" onclick="exportDetailAsImage()">Exportar imagen</button>
            </div>
            <div class="rr-count" id="countT2"></div>
            <div class="rr-scroll">
                <div id="table2Container" class="rr-empty">Seleccione un supervisor para ver el detalle.</div>
            </div>
        </div>

    </div>
</body>
</html>

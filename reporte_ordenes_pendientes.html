    <script>
        const EXPECTED_COLUMNS = [
            'proceso_agi', 'segmento', 'grupo', 'orden_trabajo', 'id_actividad', 'solicitud', 'orden_aviso',
            'producto', 'fecha_creacion', 'fecha_creacion_solicitud', 'visita', 'actividad', 'comentario',
            'estado', 'orden_regenerada', 'mercado', 'cod_unico_direccion', 'cod_instalacion', 'nomenclatura_mp',
            'municipio', 'coordenadax', 'coordenaday', 'correria_lectura', 'correria_reparto', 'descripcion_l',
            'descripcion_r', 'tipo_direccion_mp', 'region', 'corregimiento', 'comuna', 'barrio', 'vereda',
            'zona_operativa', 'desc_sector_operativo_ab', 'ciclo_operativo', 'ciclo_facturacion',
            'servicio_pedidos_ab', 'tipo_producto_agrup', 'estado_corte', 'tipo_servicio', 'categoria',
            'sub_categoria', 'medidor', 'consumo_cobrado', 'cons_inv', 'cuentas_saldo', 'saldo_cuentas',
            'cuentas_vencidas', 'saldo_cuentasvencidas', 'cta_base_sus', 'ans_creacion', 'ans_primera_asignacion',
            'ans_asignacion', 'zona_operativa_ped', 'nombre_cliente', 'telefono_avisar', 'celular_avisar',
            'interiores_agrupados', 'serie_equipo', 'series_agrupados', 'transformador', 'criterio_pedidos', 'cod_contrato'
        ];
        const IMPORT_BATCH_SIZE = 1000;
        const UI_YIELD_EVERY_ROWS = 2000;
        const DEFAULT_IMPORT_PROCESO_AGI_FILTER = 'LECTURA';
        const DEFAULT_IMPORT_CICLO_OPERATIVO_FILTER = '';

        function normalizeHeaderName(rawHeader) {
            return String(rawHeader || '')
                .trim()
                .toLowerCase()
                .replace(/\s+/g, '_');
        }

        function normalizeCicloOperativoValue(rawValue) {
            const value = String(rawValue ?? '').trim();
            if (!value) return '';
            const numeric = Number(value);
            if (Number.isNaN(numeric)) return value;
            return String(Math.trunc(numeric));
        }

        function detectDelimiter(line) {
            const delimiters = ['|', ';', '\t', ','];
            let bestDelimiter = '|';
            let bestCount = -1;

            delimiters.forEach((candidate) => {
                const count = line.split(candidate).length - 1;
                if (count > bestCount) {
                    bestCount = count;
                    bestDelimiter = candidate;
                }
            });

            return bestDelimiter;
        }

        function updateImportProgress(statusText, percent = null) {
            const statusEl = document.getElementById('import-status');
            const progressEl = document.getElementById('import-progress');

            if (statusEl) {
                statusEl.textContent = statusText;
            }

            if (progressEl && typeof percent === 'number') {
                progressEl.value = Math.max(0, Math.min(100, percent));
            }
        }

        async function insertBatchWithRetry(batch, maxRetries = 3) {
            let attempt = 0;
            while (attempt < maxRetries) {
                attempt += 1;
                const { error } = await supabase.from(TABLE_NAME).insert(batch);
                if (!error) return;
                if (attempt >= maxRetries) {
                    throw error;
                }
                await new Promise((resolve) => setTimeout(resolve, 800 * attempt));
            }
        }

        // Función para descargar plantilla CSV
        function descargarPlantillaCSV() {
            const columnas = EXPECTED_COLUMNS;
            const csv = columnas.join(';') + '\n';
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'plantilla_reporte_ordenes_pendientes.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Función para abrir modal de importación
        function openImportModal() {
            const modal = document.getElementById('dataModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            const modalConfirm = document.getElementById('modalConfirm');
            const cicloOptionsHtml = Array.from({ length: 20 }, (_, i) => {
                const value = String(i + 1);
                return `<option value="${value}">${value}</option>`;
            }).join('');
            
            modalTitle.textContent = '📤 Importar Datos';
            modalBody.innerHTML = `
                                <div class="form-group">
                    <label for="fileInput">Selecciona un archivo CSV, TXT o PARQUET (.parquet):</label>
                    <input type="file" id="fileInput" accept=".csv,.txt,.parquet" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-top: 10px;">
                </div>
                <div class="form-group" style="margin-top: 12px;">
                    <label for="importProcesoAgiFilter">Filtro de carga por proceso_agi:</label>
                    <select id="importProcesoAgiFilter" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-top: 10px;">
                        <option value="LECTURA" selected>Solo LECTURA (recomendado)</option>
                        <option value="">Todos los valores</option>
                    </select>
                </div>
                <div class="form-group" style="margin-top: 12px;">
                    <label for="importCicloOperativoFilter">Filtro de carga por ciclo_operativo:</label>
                    <select id="importCicloOperativoFilter" style="width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 4px; margin-top: 10px;">
                        <option value="" selected>Todos los ciclos</option>
                        ${cicloOptionsHtml}
                    </select>
                </div>
                                <div style="margin-top: 15px; color: #7f8c8d; font-size: 0.9em;">
                    <p><strong>Formato:</strong> El delimitador del CSV/TXT se detecta automáticamente (barra vertical |, punto y coma ;, tab y coma ,). Para archivos <strong>.parquet</strong> se leen directamente las columnas.</p>
                    <p>Para archivos masivos se procesa por bloques para evitar bloqueo del navegador.</p>
                    <p>Los filtros se aplican durante la lectura para reducir inserciones innecesarias.</p>
                </div>
                <div style="margin-top: 16px;">
                    <progress id="import-progress" value="0" max="100" style="width: 100%; height: 14px;"></progress>
                    <p id="import-status" style="margin-top: 8px; color: #64748b; font-size: 0.9em;">Listo para importar</p>
                </div>
            `;
            
            modalConfirm.textContent = 'Importar';
            modalConfirm.onclick = importData;
            modal.style.display = 'block';
        }

                function isParquetFile(fileName) {
            return String(fileName || '').toLowerCase().endsWith('.parquet');
        }

        async function importParquetFile(file, modalConfirm, procesoAgiFilter, cicloOperativoFilter, helpers) {
            const { updateProgress } = helpers;

            modalConfirm.disabled = true;
            modalConfirm.textContent = 'Importando...';

            const activeFilters = [];
            if (procesoAgiFilter) activeFilters.push(`proceso_agi = ${procesoAgiFilter}`);
            if (cicloOperativoFilter) activeFilters.push(`ciclo_operativo = ${cicloOperativoFilter}`);

            let insertedRows = 0;
            let processedRows = 0;
            let skippedRows = 0;

            try {
                if (typeof hyparquet === 'undefined') {
                    throw new Error('La librería para leer .parquet no está disponible. Verifica la conexión a Internet.');
                }

                updateProgress('Leyendo archivo .parquet con hyparquet...', 5);

                                const arrayBuffer = await file.arrayBuffer();
                // hyparquet recibe un ArrayBuffer y opcionalmente el nombre del archivo
                let parsed;
                try {
                    if (typeof hyparquet === 'function') {
                        parsed = await hyparquet({ file: arrayBuffer, filename: file.name });
                    } else if (hyparquet && typeof hyparquet.default === 'function') {
                        parsed = await hyparquet.default({ file: arrayBuffer, filename: file.name });
                    } else {
                        throw new Error('Librería hyparquet no detectada correctamente.');
                    }
                } catch (e) {
                    throw new Error('Error al leer parquet: ' + e.message);
                }

                // Materializar filas de forma robusta (acepta varios formatos de hyparquet)
                const rows = materializeParquetRows(parsed);

                if (!Array.isArray(rows) || rows.length === 0) {
                    updateProgress('El archivo .parquet no contiene filas.', 100);
                    alert('El archivo .parquet no contiene filas para importar.');
                    return;
                }

                processedRows = rows.length;

                let batch = [];
                for (let i = 0; i <= rows.length; i++) {
                    if (i < rows.length) {
                        const rawRow = rows[i];

                        if (procesoAgiFilter) {
                            const value = String(lookupColumnValue(rawRow, 'proceso_agi') != null ? lookupColumnValue(rawRow, 'proceso_agi') : '').trim().toUpperCase();
                            if (value !== procesoAgiFilter) {
                                skippedRows += 1;
                                continue;
                            }
                        }

                        if (cicloOperativoFilter) {
                            const value = normalizeCicloOperativoValue(lookupColumnValue(rawRow, 'ciclo_operativo'));
                            if (value !== cicloOperativoFilter) {
                                skippedRows += 1;
                                continue;
                            }
                        }

                        batch.push(normalizeRow(rawRow, lookupColumnValue));
                    }

                    if (batch.length >= IMPORT_BATCH_SIZE || i === rows.length) {
                        if (batch.length === 0) continue;
                        const currentBatch = batch;
                        batch = [];
                        await insertBatchWithRetry(currentBatch);
                        insertedRows += currentBatch.length;
                        const pct = i >= rows.length ? 100 : Math.floor((i / rows.length) * 95) + 5;
                        updateProgress(
                            `Leidas: ${processedRows.toLocaleString('es-ES')} | Insertadas: ${insertedRows.toLocaleString('es-ES')} | Omitidas: ${skippedRows.toLocaleString('es-ES')}`,
                            pct
                        );
                        await new Promise((resolve) => setTimeout(resolve, 0));
                    }
                }

                if (insertedRows === 0) {
                    const noDataMsg = activeFilters.length > 0
                        ? `No se encontraron registros para importar con ${activeFilters.join(' y ')}.`
                        : 'No se encontraron registros para importar';
                    alert(noDataMsg);
                    updateProgress(
                        `${noDataMsg} Leidas: ${processedRows.toLocaleString('es-ES')} | Omitidas: ${skippedRows.toLocaleString('es-ES')}`,
                        100
                    );
                    return;
                }

                updateProgress(
                    `Importacion finalizada. Leidas ${processedRows.toLocaleString('es-ES')}, insertadas ${insertedRows.toLocaleString('es-ES')} y omitidas ${skippedRows.toLocaleString('es-ES')}.`,
                    100
                );
                const alertMsg = activeFilters.length > 0
                    ? `Importacion completada: ${insertedRows.toLocaleString('es-ES')} registros insertados con ${activeFilters.join(' y ')}.\nOmitidas: ${skippedRows.toLocaleString('es-ES')} filas.`
                    : `Importacion completada: ${insertedRows.toLocaleString('es-ES')} registros insertados.`;
                alert(alertMsg);
                closeModal();
                loadData();
            } catch (error) {
                console.error(error);
                updateProgress(`Error: ${error.message}`, 0);
                alert('Error al procesar el archivo .parquet: ' + error.message);
            } finally {
                modalConfirm.disabled = false;
                modalConfirm.textContent = 'Importar';
            }
        }

                function normalizeRow(rawRow, lookup) {
            const row = {};
            EXPECTED_COLUMNS.forEach((col) => {
                const value = lookup(rawRow, col);
                row[col] = value !== null && value !== undefined ? String(value).trim() : '';
            });
            return row;
        }

        function lookupColumnValue(rawRow, expectedColumn) {
            if (!rawRow || typeof rawRow !== 'object') return null;
            if (Object.prototype.hasOwnProperty.call(rawRow, expectedColumn)) {
                return rawRow[expectedColumn];
            }
            // Fallback: buscar clave normalizada (minúsculas con guiones bajos)
            const matchingKey = Object.keys(rawRow).find((key) => normalizeHeaderName(key) === expectedColumn);
            return matchingKey !== undefined ? rawRow[matchingKey] : null;
        }

        // Convierte la salida de hyparquet en un array de filas (objetos con nombre de columna).
        // Soporta dos formatos típicos:
        //   - parsed.data ya es un array de objetos (clave = nombre de columna).
        //   - parsed.data es un array de filas donde cada fila es un array indexado por columna,
        //     y parsed.columns proporciona el nombre de cada columna en orden.
        function materializeParquetRows(parsed) {
            if (Array.isArray(parsed)) return parsed;

            if (!parsed || !parsed.data) {
                throw new Error('El lector de .parquet no devolvió datos utilizables.');
            }

            const rawData = parsed.data;
            const columnsInfo = Array.isArray(parsed.columns) ? parsed.columns : [];

            // Caso 1: data ya son objetos con claves reconocibles
            if (rawData.length > 0 && typeof rawData[0] === 'object' && !Array.isArray(rawData[0])) {
                const first = rawData[0];
                const looksKeyed = Object.keys(first).length > 0 &&
                    Object.keys(first).some((k) => normalizeHeaderName(k) === 'proceso_agi' || normalizeHeaderName(k) === 'orden_trabajo' || /[a-z_]/.test(k));
                if (looksKeyed) {
                    return rawData;
                }
            }

            // Caso 2: formato columnar / filas indexadas por columna
            const colNames = columnsInfo.map((c) => (c && typeof c.name !== 'undefined' ? normalizeHeaderName(c.name) : ''));
            const objects = rawData.map((row) => {
                const obj = {};
                if (Array.isArray(row)) {
                    row.forEach((value, idx) => {
                        if (idx < colNames.length) {
                            obj[colNames[idx]] = value;
                        }
                    });
                } else if (row && typeof row === 'object') {
                    // keys pueden ser índices numéricos (string)
                    Object.keys(row).forEach((key) => {
                        const idx = Number(key);
                        const colName = Number.isFinite(idx) && colNames[idx] ? colNames[idx] : normalizeHeaderName(key);
                        obj[colName] = row[key];
                    });
                }
                return obj;
            });
            return objects;
        }

        // Función para importar datos
        async function importData() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const modalConfirm = document.getElementById('modalConfirm');
            const importProcesoAgiFilter = document.getElementById('importProcesoAgiFilter');
            const procesoAgiFilter = String(importProcesoAgiFilter?.value || DEFAULT_IMPORT_PROCESO_AGI_FILTER)
                .trim()
                .toUpperCase();
            const importCicloOperativoFilter = document.getElementById('importCicloOperativoFilter');
            const cicloOperativoFilter = normalizeCicloOperativoValue(
                importCicloOperativoFilter?.value || DEFAULT_IMPORT_CICLO_OPERATIVO_FILTER
            );
            
            if (!file) {
                alert('Por favor selecciona un archivo');
                return;
            }

            const continueImport = confirm(
                `El archivo pesa ${(file.size / (1024 * 1024)).toFixed(1)} MB.\n` +
                'Se cargará por lotes para evitar bloqueo, pero puede tardar varios minutos.\n\n' +
                '¿Deseas continuar?'
            );

                        if (!continueImport) return;

            // Procesar archivos .parquet con la librería hyparquet
            if (isParquetFile(file.name)) {
                await importParquetFile(
                    file,
                    modalConfirm,
                    procesoAgiFilter,
                    cicloOperativoFilter,
                    { updateProgress: updateImportProgress }
                );
                return;
            }

            modalConfirm.disabled = true;
            modalConfirm.textContent = 'Importando...';
            const activeFilters = [];
            if (procesoAgiFilter) activeFilters.push(`proceso_agi = ${procesoAgiFilter}`);
            if (cicloOperativoFilter) activeFilters.push(`ciclo_operativo = ${cicloOperativoFilter}`);
            updateImportProgress(
                activeFilters.length > 0
                    ? `Inicializando lectura de archivo (${activeFilters.join(' | ')})...`
                    : 'Inicializando lectura de archivo (sin filtros)...',
                0
            );

            let insertedRows = 0;
            let processedRows = 0;
            let skippedRows = 0;

            try {
                const decoder = new TextDecoder('utf-8');
                const reader = file.stream().getReader();
                let buffer = '';
                let headerProcessed = false;
                let delimiter = '|';
                let headers = [];
                let procesoAgiIndex = -1;
                let cicloOperativoIndex = -1;
                let batch = [];
                let bytesRead = 0;

                const flushBatch = async () => {
                    if (batch.length === 0) return;
                    const currentBatch = batch;
                    batch = [];
                    await insertBatchWithRetry(currentBatch);
                    insertedRows += currentBatch.length;
                    updateImportProgress(
                        `Leidas: ${processedRows.toLocaleString('es-ES')} | Insertadas: ${insertedRows.toLocaleString('es-ES')} | Omitidas: ${skippedRows.toLocaleString('es-ES')}`,
                        Math.floor((bytesRead / file.size) * 100)
                    );
                };

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    bytesRead += value.byteLength;
                    buffer += decoder.decode(value, { stream: true });

                    const lines = buffer.split(/\r?\n/);
                    buffer = lines.pop() || '';

                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i];
                        if (!line || !line.trim()) continue;

                        if (!headerProcessed) {
                            delimiter = detectDelimiter(line);
                            headers = line.split(delimiter).map(normalizeHeaderName);
                            procesoAgiIndex = headers.indexOf('proceso_agi');
                            cicloOperativoIndex = headers.indexOf('ciclo_operativo');

                            const missingColumns = EXPECTED_COLUMNS.filter((col) => !headers.includes(col));
                            if (missingColumns.length > 0) {
                                throw new Error(
                                    `El encabezado no coincide. Faltan ${missingColumns.length} columnas, por ejemplo: ${missingColumns.slice(0, 5).join(', ')}`
                                );
                            }

                            if (procesoAgiFilter && procesoAgiIndex === -1) {
                                throw new Error('No se encontro la columna proceso_agi para aplicar el filtro.');
                            }

                            if (cicloOperativoFilter && cicloOperativoIndex === -1) {
                                throw new Error('No se encontro la columna ciclo_operativo para aplicar el filtro.');
                            }

                            headerProcessed = true;
                            continue;
                        }

                        const values = line.split(delimiter);
                        processedRows += 1;

                        if (procesoAgiFilter) {
                            const procesoAgiValue = String(values[procesoAgiIndex] != null ? values[procesoAgiIndex] : '')
                                .trim()
                                .toUpperCase();
                            if (procesoAgiValue !== procesoAgiFilter) {
                                skippedRows += 1;
                                if (processedRows % UI_YIELD_EVERY_ROWS === 0) {
                                    await new Promise((resolve) => setTimeout(resolve, 0));
                                }
                                continue;
                            }
                        }

                        if (cicloOperativoFilter) {
                            const cicloOperativoValue = normalizeCicloOperativoValue(values[cicloOperativoIndex]);
                            if (cicloOperativoValue !== cicloOperativoFilter) {
                                skippedRows += 1;
                                if (processedRows % UI_YIELD_EVERY_ROWS === 0) {
                                    await new Promise((resolve) => setTimeout(resolve, 0));
                                }
                                continue;
                            }
                        }

                        const row = {};

                        headers.forEach((header, idx) => {
                            if (EXPECTED_COLUMNS.includes(header)) {
                                row[header] = values[idx] != null ? String(values[idx]).trim() : '';
                            }
                        });

                        batch.push(row);

                        if (batch.length >= IMPORT_BATCH_SIZE) {
                            await flushBatch();
                        }

                        if (processedRows % UI_YIELD_EVERY_ROWS === 0) {
                            await new Promise((resolve) => setTimeout(resolve, 0));
                        }
                    }
                }

                buffer += decoder.decode();
                if (buffer.trim()) {
                    const values = buffer.split(delimiter);
                    processedRows += 1;

                    let shouldImport = true;
                    if (procesoAgiFilter) {
                        const procesoAgiValue = String(values[procesoAgiIndex] != null ? values[procesoAgiIndex] : '')
                            .trim()
                            .toUpperCase();
                        shouldImport = procesoAgiValue === procesoAgiFilter;
                    }

                    if (shouldImport && cicloOperativoFilter) {
                        const cicloOperativoValue = normalizeCicloOperativoValue(values[cicloOperativoIndex]);
                        shouldImport = cicloOperativoValue === cicloOperativoFilter;
                    }

                    if (shouldImport) {
                        const row = {};
                        headers.forEach((header, idx) => {
                            if (EXPECTED_COLUMNS.includes(header)) {
                                row[header] = values[idx] != null ? String(values[idx]).trim() : '';
                            }
                        });
                        batch.push(row);
                    } else {
                        skippedRows += 1;
                    }
                }

                await flushBatch();

                if (insertedRows === 0) {
                    const noDataMsg = activeFilters.length > 0
                        ? `No se encontraron registros para importar con ${activeFilters.join(' y ')}.`
                        : 'No se encontraron registros para importar';
                    alert(noDataMsg);
                    updateImportProgress(
                        `${noDataMsg} Leidas: ${processedRows.toLocaleString('es-ES')} | Omitidas: ${skippedRows.toLocaleString('es-ES')}`,
                        100
                    );
                    return;
                }

                updateImportProgress(
                    `Importacion finalizada. Leidas ${processedRows.toLocaleString('es-ES')}, insertadas ${insertedRows.toLocaleString('es-ES')} y omitidas ${skippedRows.toLocaleString('es-ES')}.`,
                    100
                );
                const alertMsg = activeFilters.length > 0
                    ? `Importacion completada: ${insertedRows.toLocaleString('es-ES')} registros insertados con ${activeFilters.join(' y ')}.\nOmitidas: ${skippedRows.toLocaleString('es-ES')} filas.`
                    : `Importacion completada: ${insertedRows.toLocaleString('es-ES')} registros insertados.`;
                alert(alertMsg);
                closeModal();
                loadData();
            } catch (error) {
                console.error(error);
                updateImportProgress(`Error: ${error.message}`, 0);
                alert('Error al procesar el archivo: ' + error.message);
            } finally {
                modalConfirm.disabled = false;
                modalConfirm.textContent = 'Importar';
            }
        }

        // Función para limpiar tabla
        async function limpiarTabla() {
            if (confirm('¿Estás seguro de que deseas borrar todos los registros? Esta acción no se puede deshacer.')) {
                try {
                    const { error } = await supabase
                        .from(TABLE_NAME)
                        .delete()
                        .neq('id', -1); // Delete all where id != -1 (todos)
                    
                    if (error) throw error;
                    alert('Tabla limpiada correctamente');
                    loadData();
                } catch (error) {
                    alert('Error al limpiar la tabla: ' + error.message);
                    console.error(error);
                }
            }
        }

        // Función para cerrar modal
        function closeModal() {
            document.getElementById('dataModal').style.display = 'none';
        }

        // Cerrar modal al hacer click fuera
        window.onclick = function(event) {
            const modal = document.getElementById('dataModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>
</body>

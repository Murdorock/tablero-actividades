    <!-- Loader ES module para lectura de archivos .parquet (hyparquet + compresores) -->
    <script type="module">
        import { parquetReadObjects } from 'https://cdn.jsdelivr.net/npm/hyparquet@1.29.2/+esm';
        import { compressors } from 'https://cdn.jsdelivr.net/npm/hyparquet-compressors@1.1.1/+esm';

        // Función expuesta global: recibe un ArrayBuffer y devuelve las filas del .parquet como objetos.
        window.parquetReadObjects = parquetReadObjects;
        window.parquetCompressors = compressors;

                // Expone un Helper listo para convertir un ArrayBuffer en el objeto 'file' que espera hyparquet.
        // IMPORTANTE: hyparquet espera que 'slice' devuelva un ArrayBuffer (no un Uint8Array).
        window.readParquetBufferToUri = function (arrayBuffer) {
            const bytes = new Uint8Array(arrayBuffer);
            return {
                byteLength: bytes.length,
                slice(start, end) {
                    const s = Math.max(0, start || 0);
                    const e = end === undefined ? bytes.length : end;
                    if (e <= s) {
                        return new ArrayBuffer(0);
                    }
                    return bytes.slice(s, Math.min(bytes.length, e)).buffer;
                }
            };
        };
    </script>

                // Valor que debe tener la columna "segmento" para importar filas desde .parquet.
        const PARQUET_REQUIRED_SEGMENTO = 'LECTURA';

        // Columnas que se importan al cargar un archivo .parquet, según su posición
        // (1-based) en EXPECTED_COLUMNS:
        //   1  -> proceso_agi
        //   18 -> cod_instalacion
        //   19 -> nomenclatura_mp
        //   20 -> municipio
        //   23 -> correria_lectura
        //   35 -> ciclo_operativo
        //   37 -> servicio_pedidos_ab
        //   42 -> medidor
        const PARQUET_IMPORT_COLUMN_POSITIONS = [1, 18, 19, 20, 23, 35, 37, 42];
        const PARQUET_IMPORT_COLUMNS = PARQUET_IMPORT_COLUMN_POSITIONS
            .map((pos) => EXPECTED_COLUMNS[pos - 1])
            .filter(Boolean);

        function normalizeHeaderName(rawHeader) {
            return String(rawHeader || '')
                .trim()
                .toLowerCase()
                .replace(/\s+/g, '_');
        }

                function normalizeCicloOperativoValue(rawValue) {
            // Normaliza el ciclo_operativo a su forma numérica canónica para comparar:
            //   "001" -> "1", "1.0" -> "1", " 011 " -> "11", "000" -> "0"
            // Si no es numérico, retorna el texto en minúsculas y sin espacios.
            const value = String(rawValue ?? '').trim();
            if (!value) return '';
            // Acepta solo valores numéricos (con ceros a la izquierda o decimales tipo .0)
            if (/^-?\d+(\.\d+)?$/.test(value)) {
                const numeric = Number(value);
                if (!Number.isNaN(numeric)) {
                    return String(Math.trunc(numeric));
                }
            }
            // Valores no numéricos: comparación textual normalizada
            return value.toLowerCase();
        }

        function detectDelimiter(line) {
            const delimiters = ['|', ';', '\t', ','];
            let bestDelimiter = '|';
            let bestCount = -1;

            delimiters.forEach((candidate) => {
                const count = line.split(candidate).length - 1;
                if (count > bestCount) {
                    bestCount = count;
                    bestDelimiter = candidate;
                }
            });

            return bestDelimiter;
        }

        function updateImportProgress(statusText, percent = null) {
            const statusEl = document.getElementById('import-status');
            const progressEl = document.getElementById('import-progress');

            if (statusEl) {
                statusEl.textContent = statusText;
            }

            if (progressEl && typeof percent === 'number') {
                progressEl.value = Math.max(0, Math.min(100, percent));
            }
        }

        async function insertBatchWithRetry(batch, maxRetries = 3) {
            let attempt = 0;
            while (attempt < maxRetries) {
                attempt += 1;
                const { error } = await supabase.from(TABLE_NAME).insert(batch);
                if (!error) return;
                if (attempt >= maxRetries) {
                    throw error;
                }
                await new Promise((resolve) => setTimeout(resolve, 800 * attempt));
            }
        }

                function isParquetFile(fileName) {
            return String(fileName || '').toLowerCase().endsWith('.parquet');
        }

                async function importParquetFile(file, modalConfirm, procesoAgiFilter, cicloOperativoFilter, helpers) {
            const { updateProgress } = helpers;

                        // Para .parquet SIEMPRE se importa solo segmento = LECTURA.
            const requiredSegmento = PARQUET_REQUIRED_SEGMENTO;

            modalConfirm.disabled = true;
            modalConfirm.textContent = 'Importando...';

            const activeFilters = [`segmento = ${requiredSegmento}`];
            if (cicloOperativoFilter) activeFilters.push(`ciclo_operativo = ${cicloOperativoFilter}`);

            let insertedRows = 0;
            let processedRows = 0;
            let skippedRows = 0;

                        try {
                const readObjects = window.parquetReadObjects;
                if (typeof readObjects !== 'function') {
                    throw new Error('La librería para leer .parquet (hyparquet) no está disponible. Verifica la conexión a Internet y recarga la página.');
                }

                updateProgress('Leyendo archivo .parquet (hyparquet)...', 10);

                const arrayBuffer = await file.arrayBuffer();
                const parquetFileObj = window.readParquetBufferToUri(arrayBuffer);

                // parquetReadObjects devuelve un array de filas como objetos (clave = nombre de columna del parquet)
                let rows = await readObjects({
                    file: parquetFileObj,
                    compressors: window.parquetCompressors
                });

                if (!Array.isArray(rows)) {
                    rows = materializeParquetRows({ data: rows, columns: null });
                }

                                if (rows.length === 0) {
                    updateProgress('El archivo .parquet no contiene filas.', 100);
                    alert('El archivo .parquet no contiene filas para importar.');
                    return;
                }

                                                                                                processedRows = rows.length;

                // ===== DIAGNÓSTICO TEMPORAL =====
                // Muestra las claves reales del parquet y los valores únicos de
                // proceso_agi y ciclo_operativo para entender por qué se filtra todo.
                                try {
                    const sampleKeys = Object.keys(rows[0] || {});
                    const unicosSegmento = new Map();
                    const unicosCiclo = new Map();
                    const muestra = Math.min(rows.length, 20000);
                    for (let k = 0; k < muestra; k++) {
                        const sg = lookupColumnValue(rows[k], 'segmento');
                        const pc = lookupColumnValue(rows[k], 'ciclo_operativo');
                        const vs = (sg === null || sg === undefined) ? '<null>' : String(sg);
                        const vc = (pc === null || pc === undefined) ? '<null>' : String(pc);
                        unicosSegmento.set(vs, (unicosSegmento.get(vs) || 0) + 1);
                        unicosCiclo.set(vc, (unicosCiclo.get(vc) || 0) + 1);
                    }
                    const topSegmento = [...unicosSegmento.entries()].sort((a,b)=>b[1]-a[1]).slice(0,15);
                    const topCiclo = [...unicosCiclo.entries()].sort((a,b)=>b[1]-a[1]).slice(0,30);
                    console.log('🔎 [PARQUET] Columnas detectadas:', sampleKeys);
                    console.log('🔎 [PARQUET] Valores únicos segmento (muestra ' + muestra + '):', topSegmento);
                    console.log('🔎 [PARQUET] Valores únicos ciclo_operativo (muestra ' + muestra + '):', topCiclo);
                    console.log('🔎 [PARQUET] Filtro aplicado -> segmento=' + requiredSegmento + ', ciclo_operativo=' + (cicloOperativoFilter || '(todos)'));
                    console.log('🔎 [PARQUET] Primeras filas (3):', rows.slice(0, 3));
                    window.__PARQUET_DIAG__ = { sampleKeys, topSegmento, topCiclo, requiredSegmento, cicloOperativoFilter };
                } catch (diagErr) {
                    console.warn('No se pudo generar diagnóstico del parquet:', diagErr);
                }
                // ===== FIN DIAGNÓSTICO TEMPORAL =====



                let batch = [];
                for (let i = 0; i <= rows.length; i++) {
                    if (i < rows.length) {
                        const rawRow = rows[i];

                                                // Filtro obligatorio: segmento debe ser LECTURA
                        const segmentoValue = String(lookupColumnValue(rawRow, 'segmento') ?? '').trim().toUpperCase();
                        if (segmentoValue !== requiredSegmento) {
                            skippedRows += 1;
                            continue;
                        }

                                                if (cicloOperativoFilter) {
                                                    const rawCiclo = lookupColumnValue(rawRow, 'ciclo_facturacion');
                                                    if (!cicloCoincide(rawCiclo, cicloOperativoFilter)) {
                                                        skippedRows += 1;
                                                        continue;
                                                    }
                                                }

                        // Solo se importan las columnas de PARQUET_IMPORT_COLUMNS
                        batch.push(normalizeParquetRow(rawRow, lookupColumnValue));
                    }

                    if (batch.length >= IMPORT_BATCH_SIZE || i === rows.length) {
                        if (batch.length === 0) continue;
                        const currentBatch = batch;
                        batch = [];
                        await insertBatchWithRetry(currentBatch);
                        insertedRows += currentBatch.length;
                        const pct = i >= rows.length ? 100 : Math.floor((i / rows.length) * 95) + 5;
                        updateProgress(
                            `Leidas: ${processedRows.toLocaleString('es-ES')} | Insertadas: ${insertedRows.toLocaleString('es-ES')} | Omitidas: ${skippedRows.toLocaleString('es-ES')}`,
                            pct
                        );
                        await new Promise((resolve) => setTimeout(resolve, 0));
                    }
                }

                                if (insertedRows === 0) {
                                        const diag = window.__PARQUET_DIAG__ || {};
                    const unicosSeg = (diag.topSegmento || []).map(([v,c]) => `${v} (${c})`).join(', ');
                    const unicosCic = (diag.topCiclo || []).map(([v,c]) => `${v} (${c})`).join(', ');
                    const claves = (diag.sampleKeys || []).join(', ');
                    const columnasPrimera = (rows[0] && Object.keys(rows[0])) ? 'SÍ' : 'NO';
                    const detalle = [
                        '',
                        '——— DIAGNÓSTICO DEL ARCHIVO ———',
                        'Filas leídas: ' + processedRows.toLocaleString('es-ES'),
                        'Filas omitidas: ' + skippedRows.toLocaleString('es-ES'),
                        '',
                        'Filtro aplicado: segmento=' + requiredSegmento + (cicloOperativoFilter ? (', ciclo_operativo=' + cicloOperativoFilter) : ' (todos los ciclos)'),
                        '',
                        'Valores de segmento encontrados: ' + (unicosSeg || '(ninguno / columna no encontrada)'),
                        'Valores de ciclo_operativo encontrados: ' + (unicosCic || '(ninguno / columna no encontrada)'),
                        '',
                        'Columnas detectadas en el parquet: ' + (claves || '(no se detectaron)'),
                        '',
                        'Revisa también la consola (F12) para más detalle.'
                    ].join('\n');
                    const noDataMsg = activeFilters.length > 0
                        ? `No se encontraron registros para importar con ${activeFilters.join(' y ')}.\n${detalle}`
                        : `No se encontraron registros para importar.\n${detalle}`;
                    alert(noDataMsg);
                    updateProgress(
                        `Sin registros con el filtro. Leidas: ${processedRows.toLocaleString('es-ES')} | Omitidas: ${skippedRows.toLocaleString('es-ES')}`,
                        100
                    );
                    return;
                }

                updateProgress(
                    `Importacion finalizada. Leidas ${processedRows.toLocaleString('es-ES')}, insertadas ${insertedRows.toLocaleString('es-ES')} y omitidas ${skippedRows.toLocaleString('es-ES')}.`,
                    100
                );
                const alertMsg = activeFilters.length > 0
                    ? `Importacion completada: ${insertedRows.toLocaleString('es-ES')} registros insertados con ${activeFilters.join(' y ')}.\nOmitidas: ${skippedRows.toLocaleString('es-ES')} filas.`
                    : `Importacion completada: ${insertedRows.toLocaleString('es-ES')} registros insertados.`;
                alert(alertMsg);
                closeModal();
                loadData();
            } catch (error) {
                console.error(error);
                updateProgress(`Error: ${error.message}`, 0);
                alert('Error al procesar el archivo .parquet: ' + error.message);
            } finally {
                modalConfirm.disabled = false;
                modalConfirm.textContent = 'Importar';
            }
        }

                                function normalizeRow(rawRow, lookup) {
            const row = {};
            EXPECTED_COLUMNS.forEach((col) => {
                const value = lookup(rawRow, col);
                row[col] = value !== null && value !== undefined ? String(value).trim() : '';
            });
            return row;
        }

        // Construye la fila a insertar desde un .parquet incluyendo ÚNICAMENTE
        // las columnas definidas en PARQUET_IMPORT_COLUMNS.
        function normalizeParquetRow(rawRow, lookup) {
            const row = {};
            PARQUET_IMPORT_COLUMNS.forEach((col) => {
                const value = lookup(rawRow, col);
                row[col] = value !== null && value !== undefined ? String(value).trim() : '';
            });
            return row;
        }

        function lookupColumnValue(rawRow, expectedColumn) {
            if (!rawRow || typeof rawRow !== 'object') return null;

            // 1) Coincidencia exacta
            if (Object.prototype.hasOwnProperty.call(rawRow, expectedColumn)) {
                return rawRow[expectedColumn];
            }

            const target = normalizeHeaderName(expectedColumn);

            // 2) Coincidencia por nombre normalizado (minúsculas, espacios -> _)
            const keys = Object.keys(rawRow);
            let matchingKey = keys.find((key) => normalizeHeaderName(key) === target);
            if (matchingKey !== undefined) return rawRow[matchingKey];

            // 3) Coincidencia ignorando guiones bajos (camelCase, "CicloOperativo")
            const stripUnderscores = (s) => normalizeHeaderName(s).replace(/_/g, '');
            matchingKey = keys.find((key) => stripUnderscores(key) === stripUnderscores(target));
            if (matchingKey !== undefined) return rawRow[matchingKey];

            // 4) Búsqueda difusa: alguna clave normalizada que contenga el target
            matchingKey = keys.find((key) => normalizeHeaderName(key).includes(target));
            return matchingKey !== undefined ? rawRow[matchingKey] : null;
        }

        // Convierte la salida de hyparquet en un array de filas (objetos con nombre de columna).
        // Soporta dos formatos típicos:
        //   - parsed.data ya es un array de objetos (clave = nombre de columna).
        //   - parsed.data es un array de filas donde cada fila es un array indexado por columna,
        //     y parsed.columns proporciona el nombre de cada columna en orden.
        function materializeParquetRows(parsed) {
            if (Array.isArray(parsed)) return parsed;

            if (!parsed || !parsed.data) {
                throw new Error('El lector de .parquet no devolvió datos utilizables.');
            }

            const rawData = parsed.data;
            const columnsInfo = Array.isArray(parsed.columns) ? parsed.columns : [];

            // Caso 1: data ya son objetos con claves reconocibles
            if (rawData.length > 0 && typeof rawData[0] === 'object' && !Array.isArray(rawData[0])) {
                const first = rawData[0];
                const looksKeyed = Object.keys(first).length > 0 &&
                    Object.keys(first).some((k) => normalizeHeaderName(k) === 'proceso_agi' || normalizeHeaderName(k) === 'orden_trabajo' || /[a-z_]/.test(k));
                if (looksKeyed) {
                    return rawData;
                }
            }

            // Caso 2: formato columnar / filas indexadas por columna
            const colNames = columnsInfo.map((c) => (c && typeof c.name !== 'undefined' ? normalizeHeaderName(c.name) : ''));
            const objects = rawData.map((row) => {
                const obj = {};
                if (Array.isArray(row)) {
                    row.forEach((value, idx) => {
                        if (idx < colNames.length) {
                            obj[colNames[idx]] = value;
                        }
                    });
                } else if (row && typeof row === 'object') {
                    // keys pueden ser índices numéricos (string)
                    Object.keys(row).forEach((key) => {
                        const idx = Number(key);
                        const colName = Number.isFinite(idx) && colNames[idx] ? colNames[idx] : normalizeHeaderName(key);
                        obj[colName] = row[key];
                    });
                }
                return obj;
            });
            return objects;
        }

        // Función para importar datos
        async function importData() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            const modalConfirm = document.getElementById('modalConfirm');
            const importProcesoAgiFilter = document.getElementById('importProcesoAgiFilter');
            const procesoAgiFilter = String(importProcesoAgiFilter?.value || DEFAULT_IMPORT_PROCESO_AGI_FILTER)
                .trim()
                .toUpperCase();
            const importCicloOperativoFilter = document.getElementById('importCicloOperativoFilter');
            const cicloOperativoFilter = normalizeCicloOperativoValue(
                importCicloOperativoFilter?.value || DEFAULT_IMPORT_CICLO_OPERATIVO_FILTER
            );
            
            if (!file) {
                alert('Por favor selecciona un archivo');
                return;
            }

            const continueImport = confirm(
                `El archivo pesa ${(file.size / (1024 * 1024)).toFixed(1)} MB.\n` +
                'Se cargará por lotes para evitar bloqueo, pero puede tardar varios minutos.\n\n' +
                '¿Deseas continuar?'
            );

                        if (!continueImport) return;

            // Procesar archivos .parquet con la librería hyparquet
            if (isParquetFile(file.name)) {
                await importParquetFile(
                    file,
                    modalConfirm,
                    procesoAgiFilter,
                    cicloOperativoFilter,
                    { updateProgress: updateImportProgress }
                );
                return;
            }

            modalConfirm.disabled = true;
            modalConfirm.textContent = 'Importando...';
            const activeFilters = [];
            if (procesoAgiFilter) activeFilters.push(`proceso_agi = ${procesoAgiFilter}`);
            if (cicloOperativoFilter) activeFilters.push(`ciclo_operativo = ${cicloOperativoFilter}`);
            updateImportProgress(
                activeFilters.length > 0
                    ? `Inicializando lectura de archivo (${activeFilters.join(' | ')})...`
                    : 'Inicializando lectura de archivo (sin filtros)...',
                0
            );

            let insertedRows = 0;
            let processedRows = 0;
            let skippedRows = 0;

            try {
                const decoder = new TextDecoder('utf-8');
                const reader = file.stream().getReader();
                let buffer = '';
                let headerProcessed = false;
                let delimiter = '|';
                let headers = [];
                let procesoAgiIndex = -1;
                let cicloOperativoIndex = -1;
                let batch = [];
                let bytesRead = 0;

                const flushBatch = async () => {
                    if (batch.length === 0) return;
                    const currentBatch = batch;
                    batch = [];
                    await insertBatchWithRetry(currentBatch);
                    insertedRows += currentBatch.length;
                    updateImportProgress(
                        `Leidas: ${processedRows.toLocaleString('es-ES')} | Insertadas: ${insertedRows.toLocaleString('es-ES')} | Omitidas: ${skippedRows.toLocaleString('es-ES')}`,
                        Math.floor((bytesRead / file.size) * 100)
                    );
                };

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;

                    bytesRead += value.byteLength;
                    buffer += decoder.decode(value, { stream: true });

                    const lines = buffer.split(/\r?\n/);
                    buffer = lines.pop() || '';

                    for (let i = 0; i < lines.length; i++) {
                        const line = lines[i];
                        if (!line || !line.trim()) continue;

                        if (!headerProcessed) {
                            delimiter = detectDelimiter(line);
                            headers = line.split(delimiter).map(normalizeHeaderName);
                                                        procesoAgiIndex = headers.indexOf('proceso_agi');
                            cicloOperativoIndex = headers.indexOf('ciclo_facturacion');

                            const missingColumns = EXPECTED_COLUMNS.filter((col) => !headers.includes(col));
                            if (missingColumns.length > 0) {
                                throw new Error(
                                    `El encabezado no coincide. Faltan ${missingColumns.length} columnas, por ejemplo: ${missingColumns.slice(0, 5).join(', ')}`
                                );
                            }

                            if (procesoAgiFilter && procesoAgiIndex === -1) {
                                throw new Error('No se encontro la columna proceso_agi para aplicar el filtro.');
                            }

                                                        if (cicloOperativoFilter && cicloOperativoIndex === -1) {
                                throw new Error('No se encontro la columna ciclo_facturacion para aplicar el filtro.');
                            }

                            headerProcessed = true;
                            continue;
                        }

                        const values = line.split(delimiter);
                        processedRows += 1;

                        if (procesoAgiFilter) {
                            const procesoAgiValue = String(values[procesoAgiIndex] != null ? values[procesoAgiIndex] : '')
                                .trim()
                                .toUpperCase();
                            if (procesoAgiValue !== procesoAgiFilter) {
                                skippedRows += 1;
                                if (processedRows % UI_YIELD_EVERY_ROWS === 0) {
                                    await new Promise((resolve) => setTimeout(resolve, 0));
                                }
                                continue;
                            }
                        }

                                                if (cicloOperativoFilter) {
                                                    if (!cicloCoincide(values[cicloOperativoIndex], cicloOperativoFilter)) {
                                                        skippedRows += 1;
                                                        if (processedRows % UI_YIELD_EVERY_ROWS === 0) {
                                                            await new Promise((resolve) => setTimeout(resolve, 0));
                                                        }
                                                        continue;
                                                    }
                                                }

                        const row = {};

                        headers.forEach((header, idx) => {
                            if (EXPECTED_COLUMNS.includes(header)) {
                                row[header] = values[idx] != null ? String(values[idx]).trim() : '';
                            }
                        });

                        batch.push(row);

                        if (batch.length >= IMPORT_BATCH_SIZE) {
                            await flushBatch();
                        }

                        if (processedRows % UI_YIELD_EVERY_ROWS === 0) {
                            await new Promise((resolve) => setTimeout(resolve, 0));
                        }
                    }
                }

                buffer += decoder.decode();
                if (buffer.trim()) {
                    const values = buffer.split(delimiter);
                    processedRows += 1;

                    let shouldImport = true;
                    if (procesoAgiFilter) {
                        const procesoAgiValue = String(values[procesoAgiIndex] != null ? values[procesoAgiIndex] : '')
                            .trim()
                            .toUpperCase();
                        shouldImport = procesoAgiValue === procesoAgiFilter;
                    }

                                        if (shouldImport && cicloOperativoFilter) {
                        shouldImport = cicloCoincide(values[cicloOperativoIndex], cicloOperativoFilter);
                    }

                    if (shouldImport) {
                        const row = {};
                        headers.forEach((header, idx) => {
                            if (EXPECTED_COLUMNS.includes(header)) {
                                row[header] = values[idx] != null ? String(values[idx]).trim() : '';
                            }
                        });
                        batch.push(row);
                    } else {
                        skippedRows += 1;
                    }
                }

                await flushBatch();

                if (insertedRows === 0) {
                    const noDataMsg = activeFilters.length > 0
                        ? `No se encontraron registros para importar con ${activeFilters.join(' y ')}.`
                        : 'No se encontraron registros para importar';
                    alert(noDataMsg);
                    updateImportProgress(
                        `${noDataMsg} Leidas: ${processedRows.toLocaleString('es-ES')} | Omitidas: ${skippedRows.toLocaleString('es-ES')}`,
                        100
                    );
                    return;
                }

                updateImportProgress(
                    `Importacion finalizada. Leidas ${processedRows.toLocaleString('es-ES')}, insertadas ${insertedRows.toLocaleString('es-ES')} y omitidas ${skippedRows.toLocaleString('es-ES')}.`,
                    100
                );
                const alertMsg = activeFilters.length > 0
                    ? `Importacion completada: ${insertedRows.toLocaleString('es-ES')} registros insertados con ${activeFilters.join(' y ')}.\nOmitidas: ${skippedRows.toLocaleString('es-ES')} filas.`
                    : `Importacion completada: ${insertedRows.toLocaleString('es-ES')} registros insertados.`;
                alert(alertMsg);
                closeModal();
                loadData();
            } catch (error) {
                console.error(error);
                updateImportProgress(`Error: ${error.message}`, 0);
                alert('Error al procesar el archivo: ' + error.message);
            } finally {
                modalConfirm.disabled = false;
                modalConfirm.textContent = 'Importar';
            }
        }

        // Función para limpiar tabla
        async function limpiarTabla() {
            if (confirm('¿Estás seguro de que deseas borrar todos los registros? Esta acción no se puede deshacer.')) {
                try {
                    const { error } = await supabase
                        .from(TABLE_NAME)
                        .delete()
                        .neq('id', -1); // Delete all where id != -1 (todos)
                    
                    if (error) throw error;
                    alert('Tabla limpiada correctamente');
                    loadData();
                } catch (error) {
                    alert('Error al limpiar la tabla: ' + error.message);
                    console.error(error);
                }
            }
        }

        // Función para cerrar modal
        function closeModal() {
            document.getElementById('dataModal').style.display = 'none';
        }

        // Cerrar modal al hacer click fuera
        window.onclick = function(event) {
            const modal = document.getElementById('dataModal');
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        }
    </script>

<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LECTRA | Formularios</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #020817;
      --panel: #0f172a;
      --ink: #e2e8f0;
      --muted: #94a3b8;
      --brand: #3b82f6;
      --brand-2: #2563eb;
      --line: #334155;
      --shadow: 0 18px 40px rgba(2, 6, 23, 0.45);
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.18), transparent 38%),
        linear-gradient(160deg, #020617 0%, #0b1324 45%, #020817 100%);
      color: var(--ink);
    }

    .shell {
      max-width: 1200px;
      margin: 0 auto;
      padding: 32px 20px 48px;
    }

    .hero {
      display: grid;
      gap: 16px;
      grid-template-columns: 1fr;
      align-items: end;
      margin-bottom: 24px;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .hero-copy {
      padding: 28px;
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(59, 130, 246, 0.16);
      color: #93c5fd;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 14px 0 10px;
      font-size: clamp(32px, 5vw, 54px);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    .hero-copy p {
      margin: 0;
      max-width: 62ch;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }

    .meta {
      padding: 22px;
    }

    .meta strong {
      display: block;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 8px;
    }

    .meta code {
      display: block;
      padding: 14px;
      border-radius: 14px;
      background: #f2f5ff;
      color: var(--brand);
      word-break: break-word;
    }

    .grid {
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 18px;
    }

    .sidebar,
    .workspace {
      padding: 18px;
    }

    .section-title {
      margin: 0 0 12px;
      font-size: 15px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .list {
      display: grid;
      gap: 12px;
    }

    .form-card {
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 16px;
      cursor: pointer;
      transition: transform 0.18s ease, border-color 0.18s ease, background 0.18s ease;
    }

    .form-card:hover,
    .form-card.active {
      transform: translateY(-1px);
      border-color: rgba(96, 165, 250, 0.55);
      background: rgba(37, 99, 235, 0.16);
    }

    .form-card h3 {
      margin: 0 0 6px;
      font-size: 16px;
    }

    .form-card p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
    }

    button {
      border: 0;
      border-radius: 12px;
      padding: 12px 14px;
      font-weight: 700;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      color: white;
    }

    .secondary {
      background: #1e293b;
      color: #cbd5e1;
    }

    .workspace-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px;
    }

    .workspace-head h2 {
      margin: 0;
      font-size: 22px;
    }

    .workspace-head small {
      color: var(--muted);
    }

    .editor {
      display: grid;
      gap: 12px;
    }

    .builder {
      margin-top: 14px;
      padding: 14px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #0b1324;
    }

    .builder h3 {
      margin: 0 0 10px;
      color: var(--brand);
      font-size: 14px;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .builder-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .builder-actions {
      margin-top: 10px;
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .fields-list {
      margin-top: 12px;
      display: grid;
      gap: 8px;
    }

    .field-item {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      gap: 8px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #111b31;
      padding: 10px;
    }

    .field-item small {
      color: var(--muted);
      display: block;
      margin-top: 3px;
    }

    .chip {
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(96, 165, 250, 0.35);
      background: rgba(37, 99, 235, 0.2);
      color: #bfdbfe;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .danger {
      background: rgba(127, 29, 29, 0.35);
      color: #fca5a5;
    }

    label {
      color: #cbd5e1;
      font-weight: 600;
    }

    textarea,
    input,
    select {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 14px;
      font: inherit;
      background: #0b1324;
      color: var(--ink);
    }

    textarea::placeholder,
    input::placeholder {
      color: #64748b;
    }

    textarea:focus,
    input:focus,
    select:focus,
    button:focus {
      outline: 2px solid rgba(59, 130, 246, 0.55);
      outline-offset: 1px;
    }

    textarea {
      min-height: 220px;
      resize: vertical;
    }

    .preview {
      margin-top: 16px;
      padding: 16px;
      border: 1px dashed rgba(96, 165, 250, 0.35);
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.85);
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 12px;
      color: #cbd5e1;
    }

    .json-details {
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 10px 12px;
      background: #0b1324;
    }

    .json-details summary {
      cursor: pointer;
      font-weight: 700;
      color: #93c5fd;
      user-select: none;
      list-style: none;
    }

    .json-details summary::-webkit-details-marker {
      display: none;
    }

    .json-details summary::before {
      content: '▸';
      display: inline-block;
      margin-right: 8px;
      transition: transform 0.2s ease;
    }

    .json-details[open] summary::before {
      transform: rotate(90deg);
    }

    .json-details .json-body {
      margin-top: 10px;
    }

    @media (max-width: 980px) {
      .hero,
      .grid {
        grid-template-columns: 1fr;
      }

      .builder-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="shell">
    <section class="hero">
      <div class="panel hero-copy">
        <span class="eyebrow">LECTRA Formularios</span>
        <h1>Diseña formularios dinámicos para la LECTRA.</h1>
        <p>
          Desde aquí puedes gestionar visualmente toda la información.
        </p>
      </div>
    </section>

    <section class="grid">
      <aside class="panel sidebar">
        <div class="section-title">Formularios</div>
        <div id="forms-list" class="list"></div>
      </aside>

      <main class="panel workspace">
        <div class="workspace-head">
          <div>
            <h2 id="form-title">Selecciona un formulario</h2>
            <small id="form-subtitle">Aquí se mostrará la estructura JSON que publica la web.</small>
          </div>
          <div class="toolbar">
            <button class="secondary" id="btn-new">Nuevo</button>
            <button class="danger" id="btn-delete">Eliminar formulario</button>
            <button class="primary" id="btn-save">Guardar en Supabase</button>
          </div>
        </div>

        <div class="editor">
          <label>
            Nombre del formulario
            <input id="titulo" type="text" placeholder="Ej. Inspección de campo">
          </label>
          <label>
            Código
            <input id="codigo" type="text" placeholder="Ej. inspeccion_campo">
          </label>
          <details class="json-details">
            <summary>Estructura JSON</summary>
            <div class="json-body">
              <textarea id="estructura" spellcheck="false"></textarea>
            </div>
          </details>

          <section class="builder">
            <h3>Constructor Visual de Campos</h3>
            <div class="builder-grid">
              <label>
                Id de campo
                <input id="field-id" type="text" placeholder="ej. usuario">
              </label>
              <label>
                Etiqueta
                <input id="field-label" type="text" placeholder="ej. Usuario">
              </label>
              <label>
                Tipo
                <select id="field-type">
                  <option value="text">Texto</option>
                  <option value="textarea">Texto largo</option>
                  <option value="number">Número</option>
                  <option value="select">Selección simple</option>
                  <option value="multi_select">Selección múltiple</option>
                  <option value="photo">Foto</option>
                  <option value="signature">Firma</option>
                  <option value="coordinates">Coordenadas</option>
                  <option value="date">Fecha</option>
                  <option value="time">Hora</option>
                  <option value="switch">Switch</option>
                </select>
              </label>
              <label>
                Opciones (separadas por coma)
                <input id="field-options" type="text" placeholder="Inicial, Seguimiento, Cierre">
              </label>
            </div>
            <div class="builder-actions">
              <label>
                <input id="field-required" type="checkbox">
                Obligatorio
              </label>
              <label>
                <input id="field-multi" type="checkbox">
                Foto múltiple
              </label>
              <button type="button" class="secondary" id="btn-add-field">Agregar campo</button>
            </div>
            <div class="fields-list" id="fields-list"></div>
          </section>
        </div>

        <details class="json-details" style="margin-top: 16px;">
          <summary>Vista previa JSON</summary>
          <div class="json-body">
            <div class="preview" id="preview"></div>
          </div>
        </details>
      </main>
    </section>
  </div>

  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./table-logic-formularios.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacenamiento - Sistema</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="config.js"></script>
    <style>
        .storage-panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        .storage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            align-items: end;
        }

        .storage-path {
            font-family: Consolas, "Courier New", monospace;
            background: #0f172a;
            color: #cbd5e1;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 8px 10px;
            margin-top: 10px;
            word-break: break-all;
        }

        .storage-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 880px;
        }

        .storage-table th,
        .storage-table td {
            border-bottom: 1px solid #334155;
            padding: 10px 8px;
            text-align: left;
            color: #e2e8f0;
            vertical-align: middle;
        }

        .storage-table th {
            color: #f8fafc;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: #0f172a;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .storage-table tbody tr:hover {
            background: rgba(148, 163, 184, 0.08);
        }

        .path-btn {
            background: transparent;
            color: #93c5fd;
            border: 1px solid #1d4ed8;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .path-btn:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .file-name {
            word-break: break-word;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-file {
            background: rgba(14, 165, 233, 0.16);
            color: #7dd3fc;
        }

        .badge-folder {
            background: rgba(250, 204, 21, 0.16);
            color: #fde68a;
        }

        .status-line {
            margin-top: 10px;
            font-size: 14px;
            color: #cbd5e1;
            min-height: 20px;
        }

        .status-line.error {
            color: #fecaca;
        }

        .status-line.success {
            color: #86efac;
        }

        .search-progress {
            margin-top: 8px;
            display: none;
        }

        .search-progress.visible {
            display: block;
        }

        .search-progress-track {
            width: 100%;
            height: 8px;
            border-radius: 999px;
            border: 1px solid #334155;
            background: #0f172a;
            overflow: hidden;
            position: relative;
        }

        .search-progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 999px;
            background: linear-gradient(90deg, #0ea5e9 0%, #3b82f6 100%);
            transition: width 0.18s ease;
        }

        .search-progress-fill.indeterminate {
            width: 36%;
            position: absolute;
            top: 0;
            left: 0;
            animation: searchProgressIndeterminate 1.05s linear infinite;
        }

        .search-progress-label {
            margin-top: 4px;
            color: #94a3b8;
            font-size: 12px;
        }

        @keyframes searchProgressIndeterminate {
            0% {
                transform: translateX(-130%);
            }
            100% {
                transform: translateX(320%);
            }
        }

        .action-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .storage-tools {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .selection-pill {
            border: 1px solid #334155;
            background: #0f172a;
            color: #cbd5e1;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .row-selector {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .table-actions {
                width: 100%;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="table-container">
        <div class="table-header">
            <h2>Almacenamiento</h2>
            <div class="table-actions">
                <button class="btn btn-secondary" id="btnRefresh">Refrescar</button>
                <button class="btn btn-primary" id="btnGoRoot">Ir a raiz</button>
            </div>
        </div>

        <div class="storage-panel">
            <div class="storage-grid">
                <div class="form-group" style="margin: 0;">
                    <label for="bucketName">Bucket</label>
                    <input id="bucketName" type="text" value="cold" placeholder="Ej: cold" style="width: 100%;">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="folderPath">Carpeta actual</label>
                    <input id="folderPath" type="text" placeholder="Miguel no meta mayusculas aquí" style="width: 100%;">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="searchInput">Buscar en listado</label>
                    <input id="searchInput" type="text" placeholder="Nombre de archivo o carpeta" style="width: 100%;">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="pageSizeInput">Lote de carga</label>
                    <select id="pageSizeInput" style="width: 100%;">
                        <option value="100">100</option>
                        <option value="250">250</option>
                        <option value="500" selected>500</option>
                        <option value="1000">1000</option>
                    </select>
                </div>
                <div class="form-group" style="margin: 0; display: flex; align-items: center; gap: 8px;">
                    <input id="loadAllItems" type="checkbox">
                    <label for="loadAllItems" style="margin: 0;">Traer todas las coincidencias en busqueda</label>
                </div>
                <div class="form-group" style="margin: 0;">
                    <button class="btn btn-primary" id="btnLoadFiles">Ver archivos</button>
                </div>
            </div>
            <div class="storage-path" id="currentPath">Ruta: /</div>
            <div class="storage-tools">
                <button class="btn btn-secondary" id="btnDownloadSelected">Descargar seleccionados (.zip)</button>
                <button class="btn btn-secondary" id="btnDownloadFolder">Descargar carpeta completa (.zip)</button>
                <span class="selection-pill" id="selectedCount">0 seleccionados</span>
                <label for="zipBatchSizeInput" style="color:#cbd5e1;font-size:13px;margin-left:4px;">Archivos por ZIP:</label>
                <select id="zipBatchSizeInput" style="background:#0f172a;color:#e2e8f0;border:1px solid #475569;border-radius:6px;padding:4px 8px;font-size:13px;">
                    <option value="0">Sin lotes (1 ZIP)</option>
                    <option value="500">500 por ZIP</option>
                    <option value="1000" selected>1000 por ZIP</option>
                    <option value="2000">2000 por ZIP</option>
                    <option value="5000">5000 por ZIP</option>
                </select>
            </div>
            <div class="status-line" id="statusLine"></div>
            <div class="search-progress" id="searchProgress">
                <div class="search-progress-track">
                    <div class="search-progress-fill" id="searchProgressFill"></div>
                </div>
                <div class="search-progress-label" id="searchProgressLabel"></div>
            </div>
        </div>

        <div class="storage-panel">
            <h3 style="margin-bottom: 12px; color: #f8fafc;">Subir archivo</h3>
            <div class="storage-grid">
                <div class="form-group" style="margin: 0;">
                    <label for="uploadFile">Archivo</label>
                    <input id="uploadFile" type="file" style="width: 100%;">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="uploadFolder">Subcarpeta destino (opcional)</label>
                    <input id="uploadFolder" type="text" placeholder="Ej: backup" style="width: 100%;">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="upsertFile">Reemplazar si existe</label>
                    <select id="upsertFile" style="width: 100%;">
                        <option value="false" selected>No</option>
                        <option value="true">Si</option>
                    </select>
                </div>
                <div class="form-group" style="margin: 0;">
                    <button class="btn btn-success" id="btnUploadFile">Subir</button>
                </div>
            </div>
        </div>

        <div class="data-table-wrapper">
            <table class="storage-table">
                <thead>
                    <tr>
                        <th style="width: 44px; text-align: center;">
                            <input type="checkbox" id="selectAllRows" class="row-selector" title="Seleccionar visibles">
                        </th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Tamano</th>
                        <th>Actualizado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="filesTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #94a3b8; padding: 24px;">No hay datos cargados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const bucketInput = document.getElementById('bucketName');
        const folderInput = document.getElementById('folderPath');
        const uploadFolderInput = document.getElementById('uploadFolder');
        const uploadFileInput = document.getElementById('uploadFile');
        const searchInput = document.getElementById('searchInput');
        const upsertInput = document.getElementById('upsertFile');
        const pageSizeInput = document.getElementById('pageSizeInput');
        const loadAllItemsInput = document.getElementById('loadAllItems');
        const filesTableBody = document.getElementById('filesTableBody');
        const statusLine = document.getElementById('statusLine');
        const currentPathLabel = document.getElementById('currentPath');
        const btnDownloadSelected = document.getElementById('btnDownloadSelected');
        const btnDownloadFolder = document.getElementById('btnDownloadFolder');
        const selectedCount = document.getElementById('selectedCount');
        const zipBatchSizeInput = document.getElementById('zipBatchSizeInput');
        const selectAllRows = document.getElementById('selectAllRows');
        const searchProgress = document.getElementById('searchProgress');
        const searchProgressFill = document.getElementById('searchProgressFill');
        const searchProgressLabel = document.getElementById('searchProgressLabel');

        let currentItems = [];
        let filteredItems = [];
        const selectedEntries = new Map();
        const DEFAULT_RECENT_LIMIT = 5;
        const SEARCH_DEBOUNCE_MS = 350;
        let searchDebounceTimer = null;

        function normalizePath(path) {
            if (!path) return '';
            return path
                .split('/')
                .map((part) => part.trim())
                .filter(Boolean)
                .join('/');
        }

        function joinPath(base, extra) {
            const normalizedBase = normalizePath(base);
            const normalizedExtra = normalizePath(extra);
            if (normalizedBase && normalizedExtra) return normalizedBase + '/' + normalizedExtra;
            return normalizedBase || normalizedExtra;
        }

        function resolveObjectPath(currentPath, itemName) {
            const normalizedCurrent = normalizePath(currentPath);
            const normalizedItem = normalizePath(itemName);

            if (!normalizedCurrent) return normalizedItem;
            if (!normalizedItem) return normalizedCurrent;

            const currentPrefix = normalizedCurrent + '/';
            if (normalizedItem === normalizedCurrent || normalizedItem.startsWith(currentPrefix)) {
                return normalizedItem;
            }

            return normalizedCurrent + '/' + normalizedItem;
        }

        function setStatus(message, type) {
            statusLine.textContent = message;
            statusLine.className = 'status-line';
            if (type) {
                statusLine.classList.add(type);
            }
        }

        function updateCurrentPathLabel(bucket, path) {
            const normalizedPath = normalizePath(path);
            const fullPath = normalizedPath ? '/' + normalizedPath : '/';
            currentPathLabel.textContent = 'Ruta: ' + fullPath + ' (bucket: ' + bucket + ')';
        }

        function hideSearchProgress() {
            if (!searchProgress || !searchProgressFill || !searchProgressLabel) return;
            searchProgress.classList.remove('visible');
            searchProgressFill.classList.remove('indeterminate');
            searchProgressFill.style.width = '0%';
            searchProgressLabel.textContent = '';
        }

        function showSearchProgress(options = {}) {
            if (!searchProgress || !searchProgressFill || !searchProgressLabel) return;

            const isIndeterminate = !!options.indeterminate;
            const current = Number(options.current) || 0;
            const total = Number(options.total) || 0;

            searchProgress.classList.add('visible');

            if (isIndeterminate) {
                searchProgressFill.classList.add('indeterminate');
                searchProgressFill.style.width = '36%';
            } else {
                const percent = total > 0
                    ? Math.max(0, Math.min(100, (current / total) * 100))
                    : Math.max(0, Math.min(100, current));
                searchProgressFill.classList.remove('indeterminate');
                searchProgressFill.style.width = percent.toFixed(2) + '%';
            }

            searchProgressLabel.textContent = String(options.label || '');
        }

        function formatDateValue(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '-';
            return date.toLocaleString('es-CO');
        }

        function formatSize(bytes) {
            if (!bytes && bytes !== 0) return '-';
            if (bytes === 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            let index = 0;
            let size = bytes;
            while (size >= 1024 && index < units.length - 1) {
                size /= 1024;
                index += 1;
            }
            const decimals = index === 0 ? 0 : 2;
            return size.toFixed(decimals) + ' ' + units[index];
        }

        function isFolderItem(item) {
            return item.id === null || item.metadata === null;
        }

        function getObjectPathFromItem(item) {
            if (item && item.objectPath) {
                return normalizePath(item.objectPath);
            }
            return resolveObjectPath(folderInput.value, item.name);
        }

        function buildPathCandidates(currentPath, itemName, bucket) {
            const candidates = [];

            const addCandidate = (value) => {
                const normalized = normalizePath(value);
                if (!normalized) return;
                if (!candidates.includes(normalized)) {
                    candidates.push(normalized);
                }
            };

            const normalizedCurrent = normalizePath(currentPath);
            const normalizedItem = normalizePath(itemName);
            addCandidate(resolveObjectPath(normalizedCurrent, normalizedItem));
            addCandidate(normalizedItem);

            if (normalizedCurrent && normalizedItem) {
                const currentPrefix = normalizedCurrent + '/';
                if (normalizedItem.startsWith(currentPrefix)) {
                    addCandidate(normalizedItem.slice(currentPrefix.length));
                }
            }

            const normalizedBucket = normalizePath(bucket);
            if (normalizedBucket) {
                const bucketPrefix = normalizedBucket + '/';
                const snapshot = [...candidates];
                snapshot.forEach((candidate) => {
                    if (candidate.startsWith(bucketPrefix)) {
                        addCandidate(candidate.slice(bucketPrefix.length));
                    }
                });
            }

            return candidates;
        }

        async function downloadBlobWithCandidates(bucket, candidates) {
            let lastError = null;

            for (const candidatePath of candidates) {
                const { data, error } = await supabase
                    .storage
                    .from(bucket)
                    .download(candidatePath);

                if (!error && data) {
                    return { blob: data, path: candidatePath };
                }

                lastError = error || new Error('No se recibio contenido del archivo.');
            }

            throw lastError || new Error('No se pudo descargar el archivo.');
        }

        function getVisibleObjectPaths() {
            return filteredItems.map((item) => getObjectPathFromItem(item));
        }

        function updateSelectionUI() {
            const visiblePaths = getVisibleObjectPaths();
            const selectedVisible = visiblePaths.filter((path) => selectedEntries.has(path)).length;

            if (selectAllRows) {
                if (!visiblePaths.length) {
                    selectAllRows.checked = false;
                    selectAllRows.indeterminate = false;
                } else {
                    selectAllRows.checked = selectedVisible === visiblePaths.length;
                    selectAllRows.indeterminate = selectedVisible > 0 && selectedVisible < visiblePaths.length;
                }
            }

            if (selectedCount) {
                const total = selectedEntries.size;
                selectedCount.textContent = total + (total === 1 ? ' seleccionado' : ' seleccionados');
            }
        }

        function getSearchQuery() {
            return (searchInput.value || '').trim();
        }

        function getItemTimestamp(item) {
            const value = item && (item.updated_at || item.created_at);
            const timestamp = value ? new Date(value).getTime() : 0;
            return Number.isFinite(timestamp) ? timestamp : 0;
        }

        function sortItemsByRecent(items) {
            return [...items].sort((left, right) => {
                const timestampDiff = getItemTimestamp(right) - getItemTimestamp(left);
                if (timestampDiff !== 0) {
                    return timestampDiff;
                }

                return String(left.name || '').localeCompare(String(right.name || ''), 'es', {
                    numeric: true,
                    sensitivity: 'base'
                });
            });
        }

        function hydrateStorageEntries(entries, currentPath) {
            return (entries || []).map((entry) => ({
                ...entry,
                objectPath: resolveObjectPath(currentPath, entry.name)
            }));
        }

        async function listStorageEntries(bucket, path, options = {}) {
            const requestOptions = {
                limit: Math.max(1, Number(options.limit) || 100),
                offset: Math.max(0, Number(options.offset) || 0),
                sortBy: options.sortBy || { column: 'name', order: 'asc' }
            };

            const search = (options.search || '').trim();
            if (search) {
                requestOptions.search = search;
            }

            const { data, error } = await supabase
                .storage
                .from(bucket)
                .list(path || undefined, requestOptions);

            if (error) {
                throw error;
            }

            return hydrateStorageEntries(data, path);
        }

        async function collectScopedSearchMatches(bucket, basePath, query, pageSize, maxMatches, onProgress) {
            const normalizedBase = normalizePath(basePath);
            const normalizedQuery = String(query || '').trim().toLowerCase();
            const matches = [];
            let scannedCount = 0;

            const emitProgress = () => {
                if (typeof onProgress === 'function') {
                    onProgress({
                        scannedCount,
                        matchesCount: matches.length
                    });
                }
            };

            emitProgress();

            async function visitPath(pathToVisit) {
                let offset = 0;

                while (true) {
                    const batch = await listStorageEntries(bucket, pathToVisit, {
                        limit: pageSize,
                        offset,
                        sortBy: { column: 'name', order: 'asc' }
                    });

                    for (const entry of batch) {
                        scannedCount += 1;
                        const entryName = String(entry.name || '').toLowerCase();
                        const entryPath = getObjectPathFromItem(entry);

                        if (entryName.includes(normalizedQuery)) {
                            matches.push(entry);
                            emitProgress();
                            if (matches.length >= maxMatches) {
                                return true;
                            }
                        } else if (scannedCount % 25 === 0) {
                            emitProgress();
                        }

                        if (isFolderItem(entry)) {
                            const reachedLimit = await visitPath(entryPath);
                            if (reachedLimit) {
                                return true;
                            }
                        }
                    }

                    if (batch.length < pageSize) {
                        break;
                    }

                    offset += pageSize;
                }

                return false;
            }

            await visitPath(normalizedBase);
            emitProgress();
            return matches;
        }

        function escapeHtml(text) {
            const value = String(text || '');
            return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderItems(items) {
            if (!items.length) {
                filesTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:24px;">No hay archivos o carpetas en esta ruta.</td></tr>';
                updateSelectionUI();
                return;
            }

            const rows = items.map((item, index) => {
                const folder = isFolderItem(item);
                const badge = folder
                    ? '<span class="badge badge-folder">Carpeta</span>'
                    : '<span class="badge badge-file">Archivo</span>';

                const sizeText = folder ? '-' : formatSize(item.metadata && item.metadata.size);
                const updatedText = formatDateValue(item.updated_at || item.created_at);
                const safeName = escapeHtml(item.name);
                const objectPath = getObjectPathFromItem(item);
                const isChecked = selectedEntries.has(objectPath) ? 'checked' : '';

                const actions = folder
                    ? '<button class="path-btn" data-action="open" data-index="' + index + '">Abrir</button>'
                    : '<div class="action-group">'
                        + '<button class="path-btn" data-action="view" data-index="' + index + '">Ver</button>'
                        + '<button class="path-btn" data-action="download" data-index="' + index + '">Descargar</button>'
                        + '</div>';

                return '<tr>'
                    + '<td style="text-align:center;">'
                    + '<input type="checkbox" class="row-selector" data-action="select" data-index="' + index + '" ' + isChecked + '>'
                    + '</td>'
                    + '<td class="file-name">' + safeName + '</td>'
                    + '<td>' + badge + '</td>'
                    + '<td>' + sizeText + '</td>'
                    + '<td>' + updatedText + '</td>'
                    + '<td>' + actions + '</td>'
                    + '</tr>';
            }).join('');

            filesTableBody.innerHTML = rows;
            updateSelectionUI();
        }

        function updateVisibleItems(items) {
            currentItems = [...items];
            filteredItems = [...items];
            selectedEntries.clear();
            renderItems(filteredItems);
        }

        function setSelectAllVisible(checked) {
            filteredItems.forEach((item) => {
                const objectPath = getObjectPathFromItem(item);
                if (checked) {
                    selectedEntries.set(objectPath, {
                        path: objectPath,
                        name: item.name,
                        isFolder: isFolderItem(item)
                    });
                } else {
                    selectedEntries.delete(objectPath);
                }
            });

            renderItems(filteredItems);
        }

        async function loadFiles() {
            const bucket = bucketInput.value.trim();
            const path = normalizePath(folderInput.value);
            hideSearchProgress();

            if (!bucket) {
                setStatus('Debes indicar el nombre del bucket.', 'error');
                return;
            }

            setStatus('Cargando ultimos archivos...', null);
            updateCurrentPathLabel(bucket, path);

            try {
                let recentItems = [];

                try {
                    recentItems = await listStorageEntries(bucket, path, {
                        limit: DEFAULT_RECENT_LIMIT,
                        offset: 0,
                        sortBy: { column: 'updated_at', order: 'desc' }
                    });
                } catch (sortError) {
                    console.warn('No se pudo ordenar por fecha directamente en Storage. Se aplicara fallback local.', sortError);
                    const fallbackItems = await listStorageEntries(bucket, path, {
                        limit: Math.max(DEFAULT_RECENT_LIMIT, Math.min(100, Number(pageSizeInput.value) || 100)),
                        offset: 0,
                        sortBy: { column: 'name', order: 'asc' }
                    });
                    recentItems = sortItemsByRecent(fallbackItems).slice(0, DEFAULT_RECENT_LIMIT);
                }

                updateVisibleItems(recentItems);
                setStatus('Mostrando los ' + recentItems.length + ' archivo(s) mas recientes de esta carpeta.', 'success');
            } catch (error) {
                setStatus('No se pudo listar: ' + error.message, 'error');
                filesTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#fecaca;padding:24px;">Error al listar archivos.</td></tr>';
                selectedEntries.clear();
                updateSelectionUI();
            }
        }

        async function searchFilesInBucket() {
            const bucket = bucketInput.value.trim();
            const path = normalizePath(folderInput.value);
            const query = getSearchQuery();
            const pageSize = Math.max(1, Number(pageSizeInput.value) || 100);
            const loadAllMatches = !!loadAllItemsInput.checked;
            const maxMatches = loadAllMatches ? Number.POSITIVE_INFINITY : pageSize;

            if (!bucket) {
                setStatus('Debes indicar el nombre del bucket.', 'error');
                return;
            }

            if (!query) {
                hideSearchProgress();
                await loadFiles();
                return;
            }

            setStatus('Buscando en la ruta actual del bucket...', null);
            showSearchProgress({
                indeterminate: loadAllMatches,
                current: 0,
                total: loadAllMatches ? 0 : maxMatches,
                label: loadAllMatches
                    ? 'Analizando archivos en la ruta actual...'
                    : '0/' + maxMatches + ' coincidencias encontradas'
            });
            updateCurrentPathLabel(bucket, path);

            try {
                const matches = await collectScopedSearchMatches(bucket, path, query, pageSize, maxMatches, (progress) => {
                    if (loadAllMatches) {
                        showSearchProgress({
                            indeterminate: true,
                            label: 'Analizados: ' + progress.scannedCount + ' | Coincidencias: ' + progress.matchesCount
                        });
                        return;
                    }

                    showSearchProgress({
                        indeterminate: false,
                        current: Math.min(progress.matchesCount, maxMatches),
                        total: maxMatches,
                        label: progress.matchesCount + '/' + maxMatches + ' coincidencias encontradas | Analizados: ' + progress.scannedCount
                    });
                });

                updateVisibleItems(matches);
                hideSearchProgress();

                if (matches.length) {
                    setStatus('Busqueda completada en la ruta actual: ' + matches.length + ' coincidencia(s).', 'success');
                } else {
                    setStatus('No se encontraron coincidencias en la ruta actual del bucket.', 'success');
                }
            } catch (error) {
                hideSearchProgress();
                setStatus('No se pudo buscar en el bucket: ' + error.message, 'error');
                filesTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#fecaca;padding:24px;">Error al buscar archivos.</td></tr>';
                selectedEntries.clear();
                updateSelectionUI();
            }
        }

        function scheduleSearch() {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(() => {
                searchFilesInBucket();
            }, SEARCH_DEBOUNCE_MS);
        }

        async function refreshCurrentView() {
            if (getSearchQuery()) {
                await searchFilesInBucket();
                return;
            }

            await loadFiles();
        }

        async function getFileUrl(bucket, objectPath) {
            const { data: signedData, error: signedError } = await supabase
                .storage
                .from(bucket)
                .createSignedUrl(objectPath, 120);

            if (!signedError && signedData && signedData.signedUrl) {
                return signedData.signedUrl;
            }

            const { data: publicData } = supabase
                .storage
                .from(bucket)
                .getPublicUrl(objectPath);

            if (publicData && publicData.publicUrl) {
                return publicData.publicUrl;
            }

            throw new Error('No se pudo generar URL para el archivo.');
        }

        async function openFile(item, downloadMode) {
            const bucket = bucketInput.value.trim();
            const objectPath = getObjectPathFromItem(item);
            const candidates = buildPathCandidates(folderInput.value, item.name, bucket);
            if (objectPath) {
                candidates.unshift(objectPath);
            }
            const uniqueCandidates = [...new Set(candidates.map((value) => normalizePath(value)).filter(Boolean))];

            try {
                setStatus((downloadMode ? 'Descargando ' : 'Abriendo ') + item.name + '...', null);
                const result = await downloadBlobWithCandidates(bucket, uniqueCandidates);
                const blob = result.blob;
                const resolvedPath = result.path;

                if (downloadMode) {
                    triggerBlobDownload(blob, item.name || getFileNameFromPath(resolvedPath));
                    setStatus('Descarga iniciada.', 'success');
                    return;
                }

                const objectUrl = URL.createObjectURL(blob);
                const link = document.createElement('a');
                link.href = objectUrl;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                setTimeout(() => URL.revokeObjectURL(objectUrl), 60000);

                setStatus('Archivo abierto en nueva pestana.', 'success');
            } catch (error) {
                setStatus('No se pudo abrir/descargar: ' + error.message, 'error');
            }
        }

        async function listFilesRecursive(bucket, basePath) {
            const allFiles = [];
            const normalizedBase = normalizePath(basePath);
            const pageSize = 1000;
            let offset = 0;

            while (true) {
                const { data, error } = await supabase
                    .storage
                    .from(bucket)
                    .list(normalizedBase || undefined, {
                        limit: pageSize,
                        offset,
                        sortBy: { column: 'name', order: 'asc' }
                    });

                if (error) {
                    throw error;
                }

                const batch = data || [];

                for (const entry of batch) {
                    const entryPath = joinPath(normalizedBase, entry.name);
                    if (isFolderItem(entry)) {
                        const nestedFiles = await listFilesRecursive(bucket, entryPath);
                        allFiles.push(...nestedFiles);
                    } else {
                        allFiles.push(entryPath);
                    }
                }

                if (batch.length < pageSize) {
                    break;
                }

                offset += pageSize;
            }

            return allFiles;
        }

        function getFileNameFromPath(path) {
            const normalized = normalizePath(path);
            if (!normalized) return 'archivo';
            const parts = normalized.split('/');
            return parts[parts.length - 1] || 'archivo';
        }

        function triggerBrowserDownload(url, fileName) {
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            if (fileName) {
                link.download = fileName;
            }
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function triggerBlobDownload(blob, fileName) {
            const objectUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = objectUrl;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(objectUrl);
        }

        function sanitizeZipPart(value) {
            const normalized = String(value || '').trim().toLowerCase();
            if (!normalized) return 'sin_nombre';
            return normalized
                .replace(/[^a-z0-9-_]+/g, '_')
                .replace(/_+/g, '_')
                .replace(/^_+|_+$/g, '') || 'sin_nombre';
        }

        function formatZipTimestamp() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return '' + y + m + d + '_' + h + min + s;
        }

        function buildZipFileName(bucket, basePath, prefix) {
            const bucketPart = sanitizeZipPart(bucket || 'bucket');
            const basePart = sanitizeZipPart(basePath ? basePath.split('/').pop() : 'raiz');
            const prefixPart = sanitizeZipPart(prefix || 'archivos');
            return prefixPart + '_' + bucketPart + '_' + basePart + '_' + formatZipTimestamp() + '.zip';
        }

        function getZipEntryName(objectPath, basePath) {
            const normalizedObject = normalizePath(objectPath);
            const normalizedBase = normalizePath(basePath);

            if (!normalizedBase) {
                return normalizedObject;
            }

            const prefix = normalizedBase + '/';
            if (normalizedObject.startsWith(prefix)) {
                return normalizedObject.slice(prefix.length);
            }

            return normalizedObject;
        }

        async function downloadFileBlob(bucket, objectPath) {
            const { data, error } = await supabase
                .storage
                .from(bucket)
                .download(objectPath);

            if (error) {
                throw error;
            }

            return data;
        }

        async function downloadFileByPath(bucket, objectPath) {
            const fileUrl = await getFileUrl(bucket, objectPath);
            triggerBrowserDownload(fileUrl, getFileNameFromPath(objectPath));
        }

        async function downloadManyFilesAsZip(bucket, filePaths, options = {}) {
            if (!filePaths.length) {
                setStatus('No hay archivos para descargar.', 'error');
                return;
            }

            if (typeof JSZip === 'undefined') {
                setStatus('No se pudo inicializar JSZip para comprimir archivos.', 'error');
                return;
            }

            const uniquePaths = [...new Set(filePaths.map((value) => normalizePath(value)).filter(Boolean))];
            const basePath = normalizePath(options.basePath || folderInput.value || '');
            const configuredBatch = Math.max(0, Number(zipBatchSizeInput.value) || 0);
            const batchSize = configuredBatch > 0 ? configuredBatch : uniquePaths.length;
            const totalBatches = Math.ceil(uniquePaths.length / batchSize);

            setStatus('Preparando ' + totalBatches + ' ZIP(s) con ' + uniquePaths.length + ' archivo(s) en total...', null);

            let totalOk = 0;
            let totalErrors = 0;

            for (let batchIndex = 0; batchIndex < totalBatches; batchIndex += 1) {
                const batchStart = batchIndex * batchSize;
                const batchPaths = uniquePaths.slice(batchStart, batchStart + batchSize);
                const partLabel = totalBatches > 1
                    ? '_parte' + String(batchIndex + 1).padStart(2, '0') + 'de' + String(totalBatches).padStart(2, '0')
                    : '';
                const batchPrefix = (options.prefix || 'descarga') + partLabel;
                const zipFileName = buildZipFileName(bucket, basePath, batchPrefix);

                const zip = new JSZip();
                let okCount = 0;
                let errorCount = 0;

                for (let i = 0; i < batchPaths.length; i += 1) {
                    const filePath = batchPaths[i];
                    try {
                        setStatus(
                            (totalBatches > 1 ? 'Lote ' + (batchIndex + 1) + '/' + totalBatches + ' – ' : '') +
                            'Agregando al ZIP: ' + (i + 1) + '/' + batchPaths.length, null
                        );
                        const blob = await downloadFileBlob(bucket, filePath);
                        const entryName = getZipEntryName(filePath, basePath) || getFileNameFromPath(filePath);
                        zip.file(entryName, blob);
                        okCount += 1;
                    } catch (error) {
                        console.error('Error al descargar', filePath, error);
                        errorCount += 1;
                    }
                }

                if (okCount === 0) {
                    setStatus('Lote ' + (batchIndex + 1) + ': No se pudo descargar ningun archivo.', 'error');
                    totalErrors += errorCount;
                    continue;
                }

                setStatus(
                    (totalBatches > 1 ? 'Lote ' + (batchIndex + 1) + '/' + totalBatches + ' – ' : '') +
                    'Generando archivo ZIP...', null
                );
                const zipBlob = await zip.generateAsync({
                    type: 'blob',
                    compression: 'DEFLATE',
                    compressionOptions: { level: 6 }
                });

                triggerBlobDownload(zipBlob, zipFileName);
                totalOk += okCount;
                totalErrors += errorCount;

                // Breve pausa entre lotes para no saturar el navegador
                if (batchIndex < totalBatches - 1) {
                    await new Promise((resolve) => setTimeout(resolve, 400));
                }
            }

            if (totalErrors > 0) {
                setStatus('ZIP(s) generado(s) con errores parciales. Incluidos: ' + totalOk + ', fallidos: ' + totalErrors + '.', 'error');
            } else {
                setStatus(
                    totalBatches > 1
                        ? 'Se generaron ' + totalBatches + ' ZIPs correctamente con ' + totalOk + ' archivo(s) en total.'
                        : 'ZIP generado correctamente con ' + totalOk + ' archivo(s).',
                    'success'
                );
            }
        }

        async function downloadSelectedItems() {
            const bucket = bucketInput.value.trim();
            if (!bucket) {
                setStatus('Debes indicar el bucket.', 'error');
                return;
            }

            if (!selectedEntries.size) {
                setStatus('Selecciona al menos un archivo o carpeta.', 'error');
                return;
            }

            const filesToDownload = [];

            for (const entry of selectedEntries.values()) {
                if (entry.isFolder) {
                    const nested = await listFilesRecursive(bucket, entry.path);
                    filesToDownload.push(...nested);
                } else {
                    filesToDownload.push(entry.path);
                }
            }

            if (filesToDownload.length > 30) {
                const confirmMsg = 'Se incluirán ' + filesToDownload.length + ' archivo(s) en un ZIP. ¿Continuar?';
                if (!window.confirm(confirmMsg)) {
                    setStatus('Descarga cancelada por el usuario.', 'error');
                    return;
                }
            }

            await downloadManyFilesAsZip(bucket, filesToDownload, {
                basePath: folderInput.value,
                prefix: 'seleccionados'
            });
        }

        async function downloadCurrentFolder() {
            const bucket = bucketInput.value.trim();
            const path = normalizePath(folderInput.value);

            if (!bucket) {
                setStatus('Debes indicar el bucket.', 'error');
                return;
            }

            setStatus('Recorriendo carpeta para descarga completa...', null);

            let filesToDownload = [];

            try {
                filesToDownload = await listFilesRecursive(bucket, path);
            } catch (error) {
                setStatus('No se pudo leer la carpeta: ' + error.message, 'error');
                return;
            }

            if (!filesToDownload.length) {
                setStatus('La carpeta no contiene archivos para descargar.', 'error');
                return;
            }

            const confirmMsg = 'Se descargarán ' + filesToDownload.length + ' archivo(s) de la carpeta actual. ¿Continuar?';
            if (!window.confirm(confirmMsg)) {
                setStatus('Descarga de carpeta cancelada por el usuario.', 'error');
                return;
            }

            await downloadManyFilesAsZip(bucket, filesToDownload, {
                basePath: folderInput.value,
                prefix: 'carpeta_completa'
            });
        }

        function goToFolder(item) {
            folderInput.value = joinPath(folderInput.value, item.name);
            refreshCurrentView();
        }

        function goToRoot() {
            folderInput.value = '';
            refreshCurrentView();
        }

        async function uploadFile() {
            const bucket = bucketInput.value.trim();
            const selectedFile = uploadFileInput.files && uploadFileInput.files[0];

            if (!bucket) {
                setStatus('Debes indicar el bucket antes de subir.', 'error');
                return;
            }

            if (!selectedFile) {
                setStatus('Selecciona un archivo para subir.', 'error');
                return;
            }

            const destinationBase = joinPath(folderInput.value, uploadFolderInput.value);
            const targetPath = joinPath(destinationBase, selectedFile.name);
            const upsert = upsertInput.value === 'true';

            setStatus('Subiendo ' + selectedFile.name + '...', null);

            const { error } = await supabase
                .storage
                .from(bucket)
                .upload(targetPath, selectedFile, {
                    upsert,
                    contentType: selectedFile.type || undefined
                });

            if (error) {
                setStatus('Error al subir: ' + error.message, 'error');
                return;
            }

            uploadFileInput.value = '';
            setStatus('Archivo subido correctamente a ' + targetPath, 'success');
            await refreshCurrentView();
        }

        filesTableBody.addEventListener('click', async (event) => {
            const target = event.target;
            if (!(target instanceof HTMLButtonElement)) return;

            const action = target.getAttribute('data-action');
            const index = Number(target.getAttribute('data-index'));
            const item = filteredItems[index];

            if (!item) return;

            if (action === 'open') {
                goToFolder(item);
                return;
            }

            if (action === 'view') {
                await openFile(item, false);
                return;
            }

            if (action === 'download') {
                await openFile(item, true);
            }
        });

        filesTableBody.addEventListener('change', (event) => {
            const target = event.target;
            if (!(target instanceof HTMLInputElement)) return;
            if (target.getAttribute('data-action') !== 'select') return;

            const index = Number(target.getAttribute('data-index'));
            const item = filteredItems[index];
            if (!item) return;

            const objectPath = getObjectPathFromItem(item);
            if (target.checked) {
                selectedEntries.set(objectPath, {
                    path: objectPath,
                    name: item.name,
                    isFolder: isFolderItem(item)
                });
            } else {
                selectedEntries.delete(objectPath);
            }

            updateSelectionUI();
        });

        selectAllRows.addEventListener('change', (event) => {
            const target = event.target;
            if (!(target instanceof HTMLInputElement)) return;
            setSelectAllVisible(target.checked);
        });

        document.getElementById('btnLoadFiles').addEventListener('click', refreshCurrentView);
        document.getElementById('btnRefresh').addEventListener('click', refreshCurrentView);
        document.getElementById('btnGoRoot').addEventListener('click', goToRoot);
        document.getElementById('btnUploadFile').addEventListener('click', uploadFile);
        btnDownloadSelected.addEventListener('click', downloadSelectedItems);
        btnDownloadFolder.addEventListener('click', downloadCurrentFolder);
        searchInput.addEventListener('input', scheduleSearch);

        updateCurrentPathLabel(bucketInput.value.trim() || '-', '');
        updateSelectionUI();
    </script>
</body>

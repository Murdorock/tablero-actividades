<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacenamiento - Sistema</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="config.js"></script>
    <style>
        .storage-panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 18px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.25);
        }

        .storage-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 12px;
            align-items: end;
        }

        .storage-path {
            font-family: Consolas, "Courier New", monospace;
            background: #0f172a;
            color: #cbd5e1;
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 8px 10px;
            margin-top: 10px;
            word-break: break-all;
        }

        .storage-table {
            width: 100%;
            border-collapse: collapse;
            min-width: 880px;
        }

        .storage-table th,
        .storage-table td {
            border-bottom: 1px solid #334155;
            padding: 10px 8px;
            text-align: left;
            color: #e2e8f0;
            vertical-align: middle;
        }

        .storage-table th {
            color: #f8fafc;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: #0f172a;
            position: sticky;
            top: 0;
            z-index: 5;
        }

        .storage-table tbody tr:hover {
            background: rgba(148, 163, 184, 0.08);
        }

        .path-btn {
            background: transparent;
            color: #93c5fd;
            border: 1px solid #1d4ed8;
            border-radius: 6px;
            padding: 4px 8px;
            cursor: pointer;
            font-size: 12px;
        }

        .path-btn:hover {
            background: rgba(59, 130, 246, 0.2);
        }

        .file-name {
            word-break: break-word;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            border-radius: 999px;
            padding: 3px 8px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-file {
            background: rgba(14, 165, 233, 0.16);
            color: #7dd3fc;
        }

        .badge-folder {
            background: rgba(250, 204, 21, 0.16);
            color: #fde68a;
        }

        .status-line {
            margin-top: 10px;
            font-size: 14px;
            color: #cbd5e1;
            min-height: 20px;
        }

        .status-line.error {
            color: #fecaca;
        }

        .status-line.success {
            color: #86efac;
        }

        .action-group {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .storage-tools {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
        }

        .selection-pill {
            border: 1px solid #334155;
            background: #0f172a;
            color: #cbd5e1;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 600;
        }

        .row-selector {
            width: 16px;
            height: 16px;
            accent-color: #2563eb;
            cursor: pointer;
        }

        @media (max-width: 768px) {
            .table-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .table-actions {
                width: 100%;
                flex-wrap: wrap;
            }
        }
    </style>
</head>
<body>
    <div class="table-container">
        <div class="table-header">
            <h2>Almacenamiento</h2>
            <div class="table-actions">
                <button class="btn btn-secondary" id="btnRefresh">Refrescar</button>
                <button class="btn btn-primary" id="btnGoRoot">Ir a raiz</button>
            </div>
        </div>

        <div class="storage-panel">
            <div class="storage-grid">
                <div class="form-group" style="margin: 0;">
                    <label for="bucketName">Bucket</label>
                    <input id="bucketName" type="text" value="cold" placeholder="Ej: cold" style="width: 100%;">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="folderPath">Carpeta actual</label>
                    <input id="folderPath" type="text" placeholder="Ej: evidencias/2026" style="width: 100%;">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="searchInput">Buscar en listado</label>
                    <input id="searchInput" type="text" placeholder="Nombre de archivo o carpeta" style="width: 100%;">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="pageSizeInput">Lote de carga</label>
                    <select id="pageSizeInput" style="width: 100%;">
                        <option value="100">100</option>
                        <option value="250">250</option>
                        <option value="500" selected>500</option>
                        <option value="1000">1000</option>
                    </select>
                </div>
                <div class="form-group" style="margin: 0; display: flex; align-items: center; gap: 8px;">
                    <input id="loadAllItems" type="checkbox" checked>
                    <label for="loadAllItems" style="margin: 0;">Ver todo el contenido</label>
                </div>
                <div class="form-group" style="margin: 0;">
                    <button class="btn btn-primary" id="btnLoadFiles">Ver archivos</button>
                </div>
            </div>
            <div class="storage-path" id="currentPath">Ruta: /</div>
            <div class="storage-tools">
                <button class="btn btn-secondary" id="btnDownloadSelected">Descargar seleccionados (.zip)</button>
                <button class="btn btn-secondary" id="btnDownloadFolder">Descargar carpeta completa (.zip)</button>
                <span class="selection-pill" id="selectedCount">0 seleccionados</span>
            </div>
            <div class="status-line" id="statusLine"></div>
        </div>

        <div class="storage-panel">
            <h3 style="margin-bottom: 12px; color: #f8fafc;">Subir archivo</h3>
            <div class="storage-grid">
                <div class="form-group" style="margin: 0;">
                    <label for="uploadFile">Archivo</label>
                    <input id="uploadFile" type="file" style="width: 100%;">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="uploadFolder">Subcarpeta destino (opcional)</label>
                    <input id="uploadFolder" type="text" placeholder="Ej: backup" style="width: 100%;">
                </div>
                <div class="form-group" style="margin: 0;">
                    <label for="upsertFile">Reemplazar si existe</label>
                    <select id="upsertFile" style="width: 100%;">
                        <option value="false" selected>No</option>
                        <option value="true">Si</option>
                    </select>
                </div>
                <div class="form-group" style="margin: 0;">
                    <button class="btn btn-success" id="btnUploadFile">Subir</button>
                </div>
            </div>
        </div>

        <div class="data-table-wrapper">
            <table class="storage-table">
                <thead>
                    <tr>
                        <th style="width: 44px; text-align: center;">
                            <input type="checkbox" id="selectAllRows" class="row-selector" title="Seleccionar visibles">
                        </th>
                        <th>Nombre</th>
                        <th>Tipo</th>
                        <th>Tamano</th>
                        <th>Actualizado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="filesTableBody">
                    <tr>
                        <td colspan="6" style="text-align: center; color: #94a3b8; padding: 24px;">No hay datos cargados.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const bucketInput = document.getElementById('bucketName');
        const folderInput = document.getElementById('folderPath');
        const uploadFolderInput = document.getElementById('uploadFolder');
        const uploadFileInput = document.getElementById('uploadFile');
        const searchInput = document.getElementById('searchInput');
        const upsertInput = document.getElementById('upsertFile');
        const pageSizeInput = document.getElementById('pageSizeInput');
        const loadAllItemsInput = document.getElementById('loadAllItems');
        const filesTableBody = document.getElementById('filesTableBody');
        const statusLine = document.getElementById('statusLine');
        const currentPathLabel = document.getElementById('currentPath');
        const btnDownloadSelected = document.getElementById('btnDownloadSelected');
        const btnDownloadFolder = document.getElementById('btnDownloadFolder');
        const selectedCount = document.getElementById('selectedCount');
        const selectAllRows = document.getElementById('selectAllRows');

        let currentItems = [];
        let filteredItems = [];
        const selectedEntries = new Map();

        function normalizePath(path) {
            if (!path) return '';
            return path
                .split('/')
                .map((part) => part.trim())
                .filter(Boolean)
                .join('/');
        }

        function joinPath(base, extra) {
            const normalizedBase = normalizePath(base);
            const normalizedExtra = normalizePath(extra);
            if (normalizedBase && normalizedExtra) return normalizedBase + '/' + normalizedExtra;
            return normalizedBase || normalizedExtra;
        }

        function setStatus(message, type) {
            statusLine.textContent = message;
            statusLine.className = 'status-line';
            if (type) {
                statusLine.classList.add(type);
            }
        }

        function updateCurrentPathLabel(bucket, path) {
            const normalizedPath = normalizePath(path);
            const fullPath = normalizedPath ? '/' + normalizedPath : '/';
            currentPathLabel.textContent = 'Ruta: ' + fullPath + ' (bucket: ' + bucket + ')';
        }

        function formatDateValue(value) {
            if (!value) return '-';
            const date = new Date(value);
            if (Number.isNaN(date.getTime())) return '-';
            return date.toLocaleString('es-CO');
        }

        function formatSize(bytes) {
            if (!bytes && bytes !== 0) return '-';
            if (bytes === 0) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            let index = 0;
            let size = bytes;
            while (size >= 1024 && index < units.length - 1) {
                size /= 1024;
                index += 1;
            }
            const decimals = index === 0 ? 0 : 2;
            return size.toFixed(decimals) + ' ' + units[index];
        }

        function isFolderItem(item) {
            return item.id === null || item.metadata === null;
        }

        function getObjectPathFromItem(item) {
            return joinPath(folderInput.value, item.name);
        }

        function getVisibleObjectPaths() {
            return filteredItems.map((item) => getObjectPathFromItem(item));
        }

        function updateSelectionUI() {
            const visiblePaths = getVisibleObjectPaths();
            const selectedVisible = visiblePaths.filter((path) => selectedEntries.has(path)).length;

            if (selectAllRows) {
                if (!visiblePaths.length) {
                    selectAllRows.checked = false;
                    selectAllRows.indeterminate = false;
                } else {
                    selectAllRows.checked = selectedVisible === visiblePaths.length;
                    selectAllRows.indeterminate = selectedVisible > 0 && selectedVisible < visiblePaths.length;
                }
            }

            if (selectedCount) {
                const total = selectedEntries.size;
                selectedCount.textContent = total + (total === 1 ? ' seleccionado' : ' seleccionados');
            }
        }

        function escapeHtml(text) {
            const value = String(text || '');
            return value
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderItems(items) {
            if (!items.length) {
                filesTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#94a3b8;padding:24px;">No hay archivos o carpetas en esta ruta.</td></tr>';
                updateSelectionUI();
                return;
            }

            const rows = items.map((item, index) => {
                const folder = isFolderItem(item);
                const badge = folder
                    ? '<span class="badge badge-folder">Carpeta</span>'
                    : '<span class="badge badge-file">Archivo</span>';

                const sizeText = folder ? '-' : formatSize(item.metadata && item.metadata.size);
                const updatedText = formatDateValue(item.updated_at || item.created_at);
                const safeName = escapeHtml(item.name);
                const objectPath = getObjectPathFromItem(item);
                const isChecked = selectedEntries.has(objectPath) ? 'checked' : '';

                const actions = folder
                    ? '<button class="path-btn" data-action="open" data-index="' + index + '">Abrir</button>'
                    : '<div class="action-group">'
                        + '<button class="path-btn" data-action="view" data-index="' + index + '">Ver</button>'
                        + '<button class="path-btn" data-action="download" data-index="' + index + '">Descargar</button>'
                        + '</div>';

                return '<tr>'
                    + '<td style="text-align:center;">'
                    + '<input type="checkbox" class="row-selector" data-action="select" data-index="' + index + '" ' + isChecked + '>'
                    + '</td>'
                    + '<td class="file-name">' + safeName + '</td>'
                    + '<td>' + badge + '</td>'
                    + '<td>' + sizeText + '</td>'
                    + '<td>' + updatedText + '</td>'
                    + '<td>' + actions + '</td>'
                    + '</tr>';
            }).join('');

            filesTableBody.innerHTML = rows;
            updateSelectionUI();
        }

        function applySearchFilter() {
            const query = (searchInput.value || '').trim().toLowerCase();

            if (!query) {
                filteredItems = [...currentItems];
            } else {
                filteredItems = currentItems.filter((item) => {
                    const itemName = String(item.name || '').toLowerCase();
                    const typeLabel = isFolderItem(item) ? 'carpeta' : 'archivo';
                    return itemName.includes(query) || typeLabel.includes(query);
                });
            }

            renderItems(filteredItems);
            setStatus('Mostrando ' + filteredItems.length + ' de ' + currentItems.length + ' elementos.', 'success');
        }

        function setSelectAllVisible(checked) {
            filteredItems.forEach((item) => {
                const objectPath = getObjectPathFromItem(item);
                if (checked) {
                    selectedEntries.set(objectPath, {
                        path: objectPath,
                        name: item.name,
                        isFolder: isFolderItem(item)
                    });
                } else {
                    selectedEntries.delete(objectPath);
                }
            });

            renderItems(filteredItems);
        }

        async function loadFiles() {
            const bucket = bucketInput.value.trim();
            const path = normalizePath(folderInput.value);
            const pageSize = Math.max(1, Number(pageSizeInput.value) || 500);
            const loadAll = !!loadAllItemsInput.checked;

            if (!bucket) {
                setStatus('Debes indicar el nombre del bucket.', 'error');
                return;
            }

            setStatus('Cargando archivos...', null);
            updateCurrentPathLabel(bucket, path);

            try {
                let offset = 0;
                let allItems = [];

                while (true) {
                    const { data, error } = await supabase
                        .storage
                        .from(bucket)
                        .list(path || undefined, {
                            limit: pageSize,
                            offset,
                            sortBy: { column: 'name', order: 'asc' }
                        });

                    if (error) {
                        throw error;
                    }

                    const batch = data || [];
                    allItems = allItems.concat(batch);

                    if (!loadAll || batch.length < pageSize) {
                        break;
                    }

                    offset += pageSize;
                    setStatus('Cargando archivos... ' + allItems.length + ' encontrados', null);
                }

                currentItems = allItems;
                selectedEntries.clear();
                applySearchFilter();

                if (loadAll) {
                    setStatus('Listado completo cargado: ' + currentItems.length + ' elementos.', 'success');
                } else {
                    setStatus('Listado parcial cargado: ' + currentItems.length + ' elementos.', 'success');
                }
            } catch (error) {
                setStatus('No se pudo listar: ' + error.message, 'error');
                filesTableBody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#fecaca;padding:24px;">Error al listar archivos.</td></tr>';
                selectedEntries.clear();
                updateSelectionUI();
            }
        }

        async function getFileUrl(bucket, objectPath) {
            const { data: signedData, error: signedError } = await supabase
                .storage
                .from(bucket)
                .createSignedUrl(objectPath, 120);

            if (!signedError && signedData && signedData.signedUrl) {
                return signedData.signedUrl;
            }

            const { data: publicData } = supabase
                .storage
                .from(bucket)
                .getPublicUrl(objectPath);

            if (publicData && publicData.publicUrl) {
                return publicData.publicUrl;
            }

            throw new Error('No se pudo generar URL para el archivo.');
        }

        async function openFile(item, downloadMode) {
            const bucket = bucketInput.value.trim();
            const path = normalizePath(folderInput.value);
            const objectPath = joinPath(path, item.name);

            try {
                setStatus('Generando enlace para ' + item.name + '...', null);
                const fileUrl = await getFileUrl(bucket, objectPath);

                const link = document.createElement('a');
                link.href = fileUrl;
                link.target = '_blank';
                if (downloadMode) {
                    link.download = item.name;
                }
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                setStatus(downloadMode ? 'Descarga iniciada.' : 'Archivo abierto en nueva pestana.', 'success');
            } catch (error) {
                setStatus('No se pudo abrir/descargar: ' + error.message, 'error');
            }
        }

        async function listFilesRecursive(bucket, basePath) {
            const allFiles = [];
            const normalizedBase = normalizePath(basePath);
            const pageSize = 1000;
            let offset = 0;

            while (true) {
                const { data, error } = await supabase
                    .storage
                    .from(bucket)
                    .list(normalizedBase || undefined, {
                        limit: pageSize,
                        offset,
                        sortBy: { column: 'name', order: 'asc' }
                    });

                if (error) {
                    throw error;
                }

                const batch = data || [];

                for (const entry of batch) {
                    const entryPath = joinPath(normalizedBase, entry.name);
                    if (isFolderItem(entry)) {
                        const nestedFiles = await listFilesRecursive(bucket, entryPath);
                        allFiles.push(...nestedFiles);
                    } else {
                        allFiles.push(entryPath);
                    }
                }

                if (batch.length < pageSize) {
                    break;
                }

                offset += pageSize;
            }

            return allFiles;
        }

        function getFileNameFromPath(path) {
            const normalized = normalizePath(path);
            if (!normalized) return 'archivo';
            const parts = normalized.split('/');
            return parts[parts.length - 1] || 'archivo';
        }

        function triggerBrowserDownload(url, fileName) {
            const link = document.createElement('a');
            link.href = url;
            link.target = '_blank';
            if (fileName) {
                link.download = fileName;
            }
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function triggerBlobDownload(blob, fileName) {
            const objectUrl = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = objectUrl;
            link.download = fileName;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(objectUrl);
        }

        function sanitizeZipPart(value) {
            const normalized = String(value || '').trim().toLowerCase();
            if (!normalized) return 'sin_nombre';
            return normalized
                .replace(/[^a-z0-9-_]+/g, '_')
                .replace(/_+/g, '_')
                .replace(/^_+|_+$/g, '') || 'sin_nombre';
        }

        function formatZipTimestamp() {
            const now = new Date();
            const y = now.getFullYear();
            const m = String(now.getMonth() + 1).padStart(2, '0');
            const d = String(now.getDate()).padStart(2, '0');
            const h = String(now.getHours()).padStart(2, '0');
            const min = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            return '' + y + m + d + '_' + h + min + s;
        }

        function buildZipFileName(bucket, basePath, prefix) {
            const bucketPart = sanitizeZipPart(bucket || 'bucket');
            const basePart = sanitizeZipPart(basePath ? basePath.split('/').pop() : 'raiz');
            const prefixPart = sanitizeZipPart(prefix || 'archivos');
            return prefixPart + '_' + bucketPart + '_' + basePart + '_' + formatZipTimestamp() + '.zip';
        }

        function getZipEntryName(objectPath, basePath) {
            const normalizedObject = normalizePath(objectPath);
            const normalizedBase = normalizePath(basePath);

            if (!normalizedBase) {
                return normalizedObject;
            }

            const prefix = normalizedBase + '/';
            if (normalizedObject.startsWith(prefix)) {
                return normalizedObject.slice(prefix.length);
            }

            return normalizedObject;
        }

        async function downloadFileBlob(bucket, objectPath) {
            const { data, error } = await supabase
                .storage
                .from(bucket)
                .download(objectPath);

            if (error) {
                throw error;
            }

            return data;
        }

        async function downloadFileByPath(bucket, objectPath) {
            const fileUrl = await getFileUrl(bucket, objectPath);
            triggerBrowserDownload(fileUrl, getFileNameFromPath(objectPath));
        }

        async function downloadManyFilesAsZip(bucket, filePaths, options = {}) {
            if (!filePaths.length) {
                setStatus('No hay archivos para descargar.', 'error');
                return;
            }

            if (typeof JSZip === 'undefined') {
                setStatus('No se pudo inicializar JSZip para comprimir archivos.', 'error');
                return;
            }

            const uniquePaths = [...new Set(filePaths.map((value) => normalizePath(value)).filter(Boolean))];
            let okCount = 0;
            let errorCount = 0;
            const zip = new JSZip();
            const basePath = normalizePath(options.basePath || folderInput.value || '');
            const zipFileName = options.zipFileName || buildZipFileName(bucket, basePath, options.prefix || 'descarga');

            setStatus('Preparando ZIP con ' + uniquePaths.length + ' archivo(s)...', null);

            for (let i = 0; i < uniquePaths.length; i += 1) {
                const filePath = uniquePaths[i];
                try {
                    setStatus('Agregando al ZIP: ' + (i + 1) + '/' + uniquePaths.length, null);
                    const blob = await downloadFileBlob(bucket, filePath);
                    const entryName = getZipEntryName(filePath, basePath) || getFileNameFromPath(filePath);
                    zip.file(entryName, blob);
                    okCount += 1;
                } catch (error) {
                    console.error('Error al descargar', filePath, error);
                    errorCount += 1;
                }
            }

            if (okCount === 0) {
                setStatus('No se pudo descargar ningun archivo para crear el ZIP.', 'error');
                return;
            }

            setStatus('Generando archivo ZIP...', null);
            const zipBlob = await zip.generateAsync({
                type: 'blob',
                compression: 'DEFLATE',
                compressionOptions: { level: 6 }
            });

            triggerBlobDownload(zipBlob, zipFileName);

            if (errorCount > 0) {
                setStatus('ZIP generado con errores parciales. Incluidos: ' + okCount + ', fallidos: ' + errorCount + '.', 'error');
            } else {
                setStatus('ZIP generado correctamente con ' + okCount + ' archivo(s).', 'success');
            }
        }

        async function downloadSelectedItems() {
            const bucket = bucketInput.value.trim();
            if (!bucket) {
                setStatus('Debes indicar el bucket.', 'error');
                return;
            }

            if (!selectedEntries.size) {
                setStatus('Selecciona al menos un archivo o carpeta.', 'error');
                return;
            }

            const filesToDownload = [];

            for (const entry of selectedEntries.values()) {
                if (entry.isFolder) {
                    const nested = await listFilesRecursive(bucket, entry.path);
                    filesToDownload.push(...nested);
                } else {
                    filesToDownload.push(entry.path);
                }
            }

            if (filesToDownload.length > 30) {
                const confirmMsg = 'Se incluirán ' + filesToDownload.length + ' archivo(s) en un ZIP. ¿Continuar?';
                if (!window.confirm(confirmMsg)) {
                    setStatus('Descarga cancelada por el usuario.', 'error');
                    return;
                }
            }

            await downloadManyFilesAsZip(bucket, filesToDownload, {
                basePath: folderInput.value,
                prefix: 'seleccionados'
            });
        }

        async function downloadCurrentFolder() {
            const bucket = bucketInput.value.trim();
            const path = normalizePath(folderInput.value);

            if (!bucket) {
                setStatus('Debes indicar el bucket.', 'error');
                return;
            }

            setStatus('Recorriendo carpeta para descarga completa...', null);

            let filesToDownload = [];

            try {
                filesToDownload = await listFilesRecursive(bucket, path);
            } catch (error) {
                setStatus('No se pudo leer la carpeta: ' + error.message, 'error');
                return;
            }

            if (!filesToDownload.length) {
                setStatus('La carpeta no contiene archivos para descargar.', 'error');
                return;
            }

            const confirmMsg = 'Se descargarán ' + filesToDownload.length + ' archivo(s) de la carpeta actual. ¿Continuar?';
            if (!window.confirm(confirmMsg)) {
                setStatus('Descarga de carpeta cancelada por el usuario.', 'error');
                return;
            }

            await downloadManyFilesAsZip(bucket, filesToDownload, {
                basePath: folderInput.value,
                prefix: 'carpeta_completa'
            });
        }

        function goToFolder(item) {
            folderInput.value = joinPath(folderInput.value, item.name);
            loadFiles();
        }

        function goToRoot() {
            folderInput.value = '';
            loadFiles();
        }

        async function uploadFile() {
            const bucket = bucketInput.value.trim();
            const selectedFile = uploadFileInput.files && uploadFileInput.files[0];

            if (!bucket) {
                setStatus('Debes indicar el bucket antes de subir.', 'error');
                return;
            }

            if (!selectedFile) {
                setStatus('Selecciona un archivo para subir.', 'error');
                return;
            }

            const destinationBase = joinPath(folderInput.value, uploadFolderInput.value);
            const targetPath = joinPath(destinationBase, selectedFile.name);
            const upsert = upsertInput.value === 'true';

            setStatus('Subiendo ' + selectedFile.name + '...', null);

            const { error } = await supabase
                .storage
                .from(bucket)
                .upload(targetPath, selectedFile, {
                    upsert,
                    contentType: selectedFile.type || undefined
                });

            if (error) {
                setStatus('Error al subir: ' + error.message, 'error');
                return;
            }

            uploadFileInput.value = '';
            setStatus('Archivo subido correctamente a ' + targetPath, 'success');
            await loadFiles();
        }

        filesTableBody.addEventListener('click', async (event) => {
            const target = event.target;
            if (!(target instanceof HTMLButtonElement)) return;

            const action = target.getAttribute('data-action');
            const index = Number(target.getAttribute('data-index'));
            const item = filteredItems[index];

            if (!item) return;

            if (action === 'open') {
                goToFolder(item);
                return;
            }

            if (action === 'view') {
                await openFile(item, false);
                return;
            }

            if (action === 'download') {
                await openFile(item, true);
            }
        });

        filesTableBody.addEventListener('change', (event) => {
            const target = event.target;
            if (!(target instanceof HTMLInputElement)) return;
            if (target.getAttribute('data-action') !== 'select') return;

            const index = Number(target.getAttribute('data-index'));
            const item = filteredItems[index];
            if (!item) return;

            const objectPath = getObjectPathFromItem(item);
            if (target.checked) {
                selectedEntries.set(objectPath, {
                    path: objectPath,
                    name: item.name,
                    isFolder: isFolderItem(item)
                });
            } else {
                selectedEntries.delete(objectPath);
            }

            updateSelectionUI();
        });

        selectAllRows.addEventListener('change', (event) => {
            const target = event.target;
            if (!(target instanceof HTMLInputElement)) return;
            setSelectAllVisible(target.checked);
        });

        document.getElementById('btnLoadFiles').addEventListener('click', loadFiles);
        document.getElementById('btnRefresh').addEventListener('click', loadFiles);
        document.getElementById('btnGoRoot').addEventListener('click', goToRoot);
        document.getElementById('btnUploadFile').addEventListener('click', uploadFile);
        btnDownloadSelected.addEventListener('click', downloadSelectedItems);
        btnDownloadFolder.addEventListener('click', downloadCurrentFolder);
        searchInput.addEventListener('input', applySearchFilter);

        updateCurrentPathLabel(bucketInput.value.trim() || '-', '');
        updateSelectionUI();
    </script>
</body>
</html>

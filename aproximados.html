<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aproximados - Sistema</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const TABLE_NAME = 'aproximados'; 
        const TABLE_TITLE = '📍 Aproximados';
        const PRIMARY_KEY = 'id_correria'; // Clave única para esta tabla
    </script>
    <script src="table-logic-aproximados.js"></script>
</head>
<body>
    <div class="table-container">
        <div class="table-header">
            <h2>📍 Aproximados</h2>
            <div class="table-actions">
                <button class="btn btn-primary" onclick="openCreateModal()">➕ Nuevo</button>
                <button class="btn btn-secondary" onclick="loadData()">🔄 Actualizar</button>
                <button class="btn btn-success" onclick="openImportModal()">📤 Cargar</button>
                <button class="btn btn-primary" onclick="exportToExcel()">📥 Exportar</button>
                <button class="btn btn-danger" onclick="limpiarTabla()">🗑️ Limpiar</button>
                <div id="guideMenu" style="position: relative; display: inline-block; align-self: center; margin-left: 8px;">
                    <a href="#" id="guideLink" onclick="toggleGuideMenu(event)" style="color: #93c5fd; font-weight: 700; text-decoration: underline; letter-spacing: 0.3px;">GUIA</a>
                    <div id="guideDropdown" style="display: none; position: absolute; top: calc(100% + 8px); right: 0; min-width: 260px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; box-shadow: 0 12px 24px rgba(0,0,0,0.35); z-index: 20; padding: 10px;">
                        <div style="font-size: 12px; font-weight: 700; color: #cbd5e1; margin-bottom: 8px; text-transform: uppercase;">Videos</div>
                        <a href="https://txeuzsypnwesscganktp.supabase.co/storage/v1/object/public/cold/videos_tablero_lectra/Carga%20Aproximados.mp4" target="_blank" rel="noopener noreferrer" style="display: block; color: #e2e8f0; text-decoration: none; background: #0f172a; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px; font-size: 14px;">
                            ▶ ¿Cómo cargar los aproximados?
                        </a>
                    </div>
                </div>
            </div>
        </div>
        <div class="data-table-wrapper">
            <div id="loadingIndicator" class="loading"><div class="spinner"></div><p>Cargando...</p></div>
            <div id="tableContainer"></div>
        </div>
    </div>
    <div id="dataModal" class="modal">
        <div class="modal-content">
            <div class="modal-header"><h3 id="modalTitle">Nuevo Registro</h3></div>
            <form id="dataForm">
                <input type="hidden" id="recordId">
                <div id="formFields"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancelar</button>
                    <button type="submit" class="btn btn-success">Guardar</button>
                </div>
            </form>
        </div>
    </div>
    
    <!-- Modal para importar Excel -->
    <div id="importModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>📤 Cargar datos desde Excel</h3>
            </div>
            <div style="padding: 20px;">
                <p style="margin-bottom: 15px; color: #cbd5e1;">
                    Selecciona un archivo Excel (.xlsx, .xls) con los datos a importar.
                </p>
                <div class="form-group">
                    <label for="excelFile">Archivo Excel</label>
                    <input type="file" id="excelFile" accept=".xlsx,.xls" style="padding: 5px;">
                </div>
                <div id="importProgress" style="margin-top: 18px; display: none;">
                    <h4 style="color: #e2e8f0; margin-bottom: 10px;">Progreso de importación</h4>
                    <div style="height: 12px; border-radius: 999px; background: #334155; overflow: hidden; border: 1px solid #475569;">
                        <div id="importProgressBar" style="width: 0%; height: 100%; background: linear-gradient(135deg, #10b981 0%, #059669 100%); transition: width 0.25s ease;"></div>
                    </div>
                    <p id="importProgressText" style="margin-top: 10px; font-size: 14px; color: #e2e8f0;">Esperando archivo...</p>
                    <p id="importProgressDetails" style="margin-top: 6px; font-size: 13px; color: #cbd5e1;">
                        Selecciona un archivo para iniciar.
                    </p>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" onclick="closeImportModal()">Cancelar</button>
                <button type="button" class="btn btn-success" id="btnImport" onclick="importData()" disabled>Importar Datos</button>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</body>
</html>
